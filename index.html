    document.getElementById('anLast').onclick = function(){ goto(A.moves.length); };
    document.getElementById('anFlip').onclick = function(){ A.flip = !A.flip; paintSel(); };
    paintSel();
    if(activeTab === 'practice') renderPractice();
  }
  function goto(k){ if(!A) return; A.sel = Math.max(0, Math.min(A.moves.length, k)); paintSel(); }

  function paintSel(){
    if(!A || !document.getElementById('anBoard')) return;
    var fen = A.fens[A.sel], last = null, arrows = [];
    if(A.sel > 0){
      var m = A.moves[A.sel - 1], S = A.stats[A.sel - 1];
      last = {from:m.from, to:m.to};
      var bad = ['inaccuracy', 'mistake', 'blunder'].indexOf(S.label) >= 0, bu = A.ev[A.sel - 1].best;
      if(m.color === A.me && bad && bu) arrows.push({from:bu.slice(0, 2), to:bu.slice(2, 4), color:'#1f9d55'});
    }
    document.getElementById('anBoard').innerHTML = boardHtml(fen, last, arrows, A.flip);
    var bar = document.querySelector('#anEvalBar div');
    if(bar){
      bar.style.height = winPct(pov(A, A.ev[A.sel].cp)) + '%';
      var onTop = (A.flip !== (A.me === 'b'));      // your side is at the top of the board
      bar.style.top = onTop ? '0' : 'auto'; bar.style.bottom = onTop ? 'auto' : '0';
    }
    document.getElementById('anPanel').innerHTML = panelHtml();
    var mv = document.getElementById('anMoves'), keep = mv.scrollTop;
    mv.innerHTML = movesHtml(); mv.scrollTop = keep;
    var selEl = mv.querySelector('.sel');
    if(selEl && (selEl.offsetTop < mv.scrollTop || selEl.offsetTop > mv.scrollTop + mv.clientHeight - 30)) mv.scrollTop = selEl.offsetTop - 60;
    mv.querySelectorAll('[data-ply]').forEach(function(el){ el.onclick = function(){ goto(+el.dataset.ply); }; });
    var gb = document.getElementById('anGraphBox');
    if(gb){
      gb.innerHTML = graphHtml();
      var gsvg = document.getElementById('anGraph');
      gsvg.onclick = function(e){ var r = gsvg.getBoundingClientRect(); goto(Math.round((e.clientX - r.left) / r.width * (A.fens.length - 1))); };
    }
  }
  document.addEventListener('keydown', function(e){
    if(!A || screen.style.display !== 'block' || activeTab !== 'board') return;

<script>
(function(){
  // ---------- 1. save how long each move took (Hand & Brain 1v1/2v2 and Standard; any time control, rated or not) ----------
  // Step 6 stamps moveAt = the time of the previous move (or of the game starting), so
  // "now - moveAt" is how long this move took. It is stored inside the game as moveTimes[]
  // in milliseconds. -1 means "unknown" (for example the very first move, which also includes
  // the time the players needed to arrive, so it would be misleading).
  var prevKset = window.kset;
  window.kset = function(key, value, shared){
    try{
      if(shared !== false && typeof key === 'string' && key.indexOf('hb:game:') === 0 &&
         value && typeof value === 'object' && value.moveLog){
        var n = value.moveLog.length;
        var before = typeof value.moveCount === 'number' ? value.moveCount : n - 1;
        if(n === before + 1 && (value.status === 'active' || value.status === 'finished')){
          var arr = [], old = value.moveTimes;
          for(var i = 0; i < n - 1; i++) arr.push(old && typeof old[i] === 'number' ? old[i] : -1);
          arr.push(n > 1 && typeof value.moveAt === 'number' ? Math.max(0, Math.round(serverNow() - value.moveAt)) : -1);
          value.moveTimes = arr;
        }
      }
    }catch(e){ console.error('move time failed', e); }
    return prevKset(key, value, shared);
  };

  // ---------- 2. build a PGN that carries the times ----------
  function hms(ms){
    var t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function gamePgn(g){
    var s = g.seats || {};
    var w = g.mode === 'team' ? (s.whiteBrain + ' & ' + s.whiteHand) : s.white;
    var b = g.mode === 'team' ? (s.blackBrain + ' & ' + s.blackHand) : s.black;
    var res = g.winner === 'w' ? '1-0' : g.winner === 'b' ? '0-1' : g.winner === 'draw' ? '1/2-1/2' : '*';
    var c = g.clock && g.clock.initialSec > 0 ? g.clock : null;
    var times = g.moveTimes || [];
    var rem = {w: c ? c.initialSec * 1000 : 0, b: c ? c.initialSec * 1000 : 0};
    var mt = '';
    (g.moveLog || []).forEach(function(san, i){
      var side = i % 2 === 0 ? 'w' : 'b';
      var spent = typeof times[i] === 'number' && times[i] >= 0 ? times[i] : null;
      var tags = '';
      if(spent !== null) tags += ' {[%emt ' + hms(spent) + ']}';
      if(c){
        // same accounting as the Pawniac clock: White's first move is free, the increment is added after every move
        rem[side] = Math.max(0, rem[side] - (i === 0 || spent === null ? 0 : spent)) + (c.incrementSec || 0) * 1000;
        if(spent !== null || i === 0) tags += ' {[%clk ' + hms(rem[side]) + ']}';
      }
      mt += (i % 2 === 0 ? (i / 2 + 1) + '. ' : '') + san + tags + ' ';
    });
    var tc = c ? (c.initialSec + '+' + (c.incrementSec || 0)) : '-';
    return '[Event "Pawniac game"]\n[White "' + String(w || 'White').replace(/"/g, '') + '"]\n[Black "' + String(b || 'Black').replace(/"/g, '') +
      '"]\n[Result "' + res + '"]\n[TimeControl "' + tc + '"]\n\n' + mt + res;
  }

  // ---------- 3. the "Analyze this game" button (made by step 16) now sends that PGN ----------
  // It uses only what is on the page (the Analyze tab, its box and its buttons), so step 16 stays untouched.
  function openAnalysis(pgn){
    var navLink = document.querySelector('#navbar [data-nav="analyze"]');
    if(!navLink) return;
    navLink.click();                                              // opens the Analyze tab
    var again = document.getElementById('anNewBtn');              // a game was already loaded: start fresh

  var prevDraw = window.drawGame;
  window.drawGame = function(){
    try{ prevDraw(); }
    finally{
      try{
        var bt = document.getElementById('btnAnalyzeGame');
        if(bt && !bt.dataset.t17){
          bt.dataset.t17 = '1';
          bt.onclick = function(){
            var g = gameState;
            if(!g || g.status !== 'finished') return;
            openAnalysis(gamePgn(g));
          };
        }
      }catch(e){ console.error('analyze button (step 17) failed', e); }
    }
  };
})();

<script>
(function(){

    if(n === 'handandbrain' || n === 'hand-and-brain' || n === 'hb' || n === 'home' || n === 'play') return {n:'handandbrain'};

    if(n === 'leaderboard') return {n:'leaderboard', v:(a === 'standard' ? 'standard' : 'hb')};

      case 'profile': return curProfile ? '/profile/' + curProfile : null;
    }
    return null;   // login, waiting room and live games keep whatever link was there
  }

  }
  function run(r){
    switch(r.n){
      case 'standard':
      case 'handandbrain':
        stopPoll();
        window.renderLobby();

<script>

      '<line x1="0" y1="' + H / 2 + '" x2="' + W + '" y2="' + H / 2 + '" stroke="#999" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>' + dots + '</svg>';

.ch-box{background:#fffdf9;border:1px solid #e4ddcf;border-radius:12px;padding:22px;max-width:480px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3);}
[data-theme=dark] .ch-box{background:#252320;border-color:#3a372f;}
.ch-box h2{font-size:17px;margin:0 0 4px;}
.ch-box .lbl{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#7a766c;margin:14px 0 6px;}
[data-theme=dark] .ch-box .lbl{color:#a29d90;}
.ch-box .modes{margin-bottom:8px;}
.ch-box .tc-row{margin-bottom:6px;}
.ch-acts{display:flex;gap:10px;margin-top:18px;}

/* ---- challenge notifications ---- */
#chToasts{position:fixed;right:16px;bottom:16px;z-index:1050;display:flex;flex-direction:column;gap:10px;width:330px;max-width:calc(100vw - 24px);}
.ch-toast{background:#fffdf9;border:1px solid #e4ddcf;border-radius:10px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:13px;line-height:1.5;}
[data-theme=dark] .ch-toast{background:#252320;border-color:#3a372f;}
.ch-toast .ct{font-weight:700;margin-bottom:2px;}
.ch-toast .cs{opacity:.8;margin-bottom:8px;}
.ch-toast .cb{display:flex;gap:8px;}
.ch-toast .cb button{padding:7px 12px;font-size:12.5px;}
.ch-toast.msg{font-weight:600;}
</style>
<script>
(function(){
  var EXPIRE_MS = 120000;    // a challenge lasts 2 minutes
  var HEART_MS  = 45000;     // how often your own status is refreshed
  var IDLE_MS   = 180000;    // no mouse / keyboard / touch for 3 minutes = idle
  var STALE_MS  = 180000;    // a status older than this is treated as offline (the tab probably crashed)
  var PREF_KEY  = 'pawniac-challenge';
  var NAME_RE   = /^[A-Za-z0-9_]{3,20}$/;
  var TS        = firebase.database.ServerValue.TIMESTAMP;
  var LBL       = {online:'Online', idle:'Idle', playing:'In a game', offline:'Offline'};

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function ago(ms){
    var s = Math.max(0, Math.round((serverNow() - ms) / 1000));
    if(s < 60) return 'just now';
    if(s < 3600) return Math.floor(s / 60) + 'm ago';
    if(s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function tcLabel(key){
    if(key === 'none') return 'No clock';
    var m = /^c?(\d+)\+(\d+)$/.exec(key || '');
    return m ? m[1] + '+' + m[2] : String(key);
  }
  function inGameNow(){
    var g = gameState, s = document.getElementById('screen-game');
    return !!(ME && g && g.status === 'active' && s && s.style.display === 'block' && myRole(g));
  }
  // what a stored status really means right now
  function effOf(v){
    if(!v || typeof v.t !== 'number') return {s:'offline', t:0};
    if(v.s !== 'offline' && serverNow() - v.t > STALE_MS) return {s:'offline', t:v.t};
    return v;
  }

  // =====================================================================
  //  1. your own status
  // =====================================================================
  var meName = null, statusRef = null, connRef = null, connCb = null;
  var lastActive = Date.now(), lastWritten = null, lastWriteAt = 0;

  function bumpActive(){ lastActive = Date.now(); if(lastWritten === 'idle') ownTick(); }
  ['pointerdown', 'keydown', 'mousemove', 'touchstart', 'wheel'].forEach(function(ev){
    document.addEventListener(ev, bumpActive, {passive:true, capture:true});
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) bumpActive(); });

  function computeState(){
    if(inGameNow()) return 'playing';
    return (Date.now() - lastActive > IDLE_MS) ? 'idle' : 'online';
  }
  function writeStatus(st){
    if(!statusRef) return;
    statusRef.set({s:st, t:TS}).catch(function(){});
    lastWritten = st; lastWriteAt = Date.now();
  }
  function startOwn(){
    stopOwn(false);
    meName = ME.username;
    statusRef = db.ref('hb/status/' + meName);
    connRef = db.ref('.info/connected');
    // whenever the connection comes up: arrange "offline" for when it drops, then say we are here
    connCb = connRef.on('value', function(s){
      if(s.val() === true && statusRef){
        statusRef.onDisconnect().set({s:'offline', t:TS}).then(function(){ writeStatus(computeState()); }).catch(function(){});
      }
    });
  }
  function stopOwn(markOffline){
    var p = null;
    try{ if(connRef) connRef.off('value', connCb); }catch(e){}
    if(statusRef){
      try{ statusRef.onDisconnect().cancel(); }catch(e){}
      if(markOffline) p = statusRef.set({s:'offline', t:TS}).catch(function(){});
    }
    connRef = null; connCb = null; statusRef = null; meName = null; lastWritten = null;
    return p;
  }
  function ownTick(){
    if(!ME) return;
    if(meName !== ME.username){ startOwn(); return; }
    var st = computeState();
    if(st !== lastWritten || Date.now() - lastWriteAt >= HEART_MS) writeStatus(st);
  }

  // =====================================================================
  //  2. everyone's status (only listened to on the pages that show names)
  // =====================================================================
  var STATUS = {}, feed = {on:false, loaded:false, failed:false, ref:null};
  var paintTimer = null;
  function schedulePaint(){ if(!paintTimer) paintTimer = setTimeout(function(){ paintTimer = null; paintAll(); }, 120); }

  function feedOn(){
    if(feed.on) return;
    var ref = db.ref('hb/status');
    feed.on = true; feed.loaded = false; feed.failed = false; feed.ref = ref;
    ref.once('value').then(function(s){
      if(!feed.on || feed.ref !== ref) return;
      STATUS = s.val() || {};
      feed.loaded = true;
      var up = function(c){ STATUS[c.key] = c.val(); schedulePaint(); };
      ref.on('child_added', up);
      ref.on('child_changed', up);
      ref.on('child_removed', function(c){ delete STATUS[c.key]; schedulePaint(); });
      schedulePaint();
    }).catch(function(e){ console.error('status feed failed', e); feed.failed = true; schedulePaint(); });
    schedulePaint();
  }
  function feedOff(){
    if(!feed.on) return;
    feed.on = false;
    try{ if(feed.ref) feed.ref.off(); }catch(e){}
    feed.ref = null;
  }
  function eff(n){ return effOf(STATUS[n]); }
  function statusText(n){
    if(feed.failed) return 'status unavailable';
    if(!feed.loaded) return 'checking...';
    var e = eff(n);
    return LBL[e.s] + (e.s === 'offline' && e.t ? ' \u00b7 last seen ' + ago(e.t) : '');
  }

  function dotHtml(n){ return '<span class="st-dot" data-st="' + esc(n) + '"></span>'; }
  function chBtnHtml(n){ return '<button class="secondary ch-btn" data-chto="' + esc(n) + '">Challenge</button>'; }

  function paintAll(){
    document.querySelectorAll('.st-dot[data-st]').forEach(function(d){
      var n = d.dataset.st, st = (!feed.loaded || feed.failed) ? 'unknown' : eff(n).s;
      d.className = 'st-dot st-' + st;
      d.title = statusText(n);
    });
    document.querySelectorAll('[data-stfull]').forEach(function(el){ el.textContent = statusText(el.dataset.stfull); });
    document.querySelectorAll('.ch-btn[data-chto]').forEach(function(b){
      var n = b.dataset.chto, off = feed.loaded && !feed.failed && eff(n).s === 'offline';
      b.disabled = off;
      b.title = off ? 'They are offline right now' : 'Challenge ' + n + ' to a game';
    });
    renderPlayers();
  }
  setInterval(function(){ if(feed.on) paintAll(); }, 30000);   // keeps "last seen 5m ago" fresh

  // names in the leaderboard / knight's tour lists get a dot and a Challenge button
  function decorateRows(){
    if(!ME) return;
    var changed = false;
    document.querySelectorAll('#screen-leaderboard .seat .who .user-link[data-user], #ktBoard .seat .who .user-link[data-user]').forEach(function(a){
      var n = a.dataset.user, who = a.parentNode;
      if(who.querySelector('.st-dot[data-st="' + n + '"]')) return;
      var tmp = document.createElement('span');
      tmp.innerHTML = dotHtml(n);
      who.insertBefore(tmp.firstChild, a);
      if(n !== ME.username && who.closest('#screen-leaderboard')){
        var b = document.createElement('span');
        b.innerHTML = chBtnHtml(n);
        var btn = b.firstChild;
        btn.onclick = function(e){ e.stopPropagation(); openDialog(n); };
        who.appendChild(btn);
      }
      changed = true;
    });
    if(changed) schedulePaint();
  }
  ['screen-leaderboard', 'screen-minigames'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) new MutationObserver(decorateRows).observe(el, {childList:true, subtree:true});
  });

  // =====================================================================
  //  3. the "Players" card on the Leaderboard page
  // =====================================================================
  function rowHtml(n){
    return '<div class="pl-row">' + dotHtml(n) + '<span class="user-link" data-user="' + esc(n) + '">' + esc(n) + '</span>' +
      '<span class="st-txt" data-stfull="' + esc(n) + '"></span><span class="grow"></span>' + chBtnHtml(n) + '</div>';
  }
  function renderPlayers(){
    var el = document.getElementById('plList');
    if(!el) return;
    if(feed.failed){ el.innerHTML = '<p class="hint">Player status needs the new Firebase rules (see the setup note).</p>'; return; }
    if(!feed.loaded){ el.innerHTML = '<p class="hint">Loading...</p>'; return; }
    var order = {online:0, playing:1, idle:2}, me = ME && ME.username;
    var list = Object.keys(STATUS).filter(function(n){ return n !== me && NAME_RE.test(n) && eff(n).s !== 'offline'; })
      .sort(function(a, b){ return (order[eff(a).s] - order[eff(b).s]) || a.localeCompare(b); }).slice(0, 25);
    el.innerHTML = list.length ? list.map(rowHtml).join('') : '<p class="hint">Nobody else is online right now.</p>';
    el.querySelectorAll('.ch-btn[data-chto]').forEach(function(b){ b.onclick = function(){ openDialog(b.dataset.chto); }; });
    el.querySelectorAll('.st-dot[data-st]').forEach(function(d){ d.className = 'st-dot st-' + eff(d.dataset.st).s; d.title = statusText(d.dataset.st); });
    el.querySelectorAll('[data-stfull]').forEach(function(t){ t.textContent = statusText(t.dataset.stfull); });
  }
  function addPlayersCard(){
    var el = document.getElementById('screen-leaderboard');
    if(!el || el.querySelector('#plCard')) return;
    var card = document.createElement('div');
    card.className = 'card';
    card.id = 'plCard';
    card.innerHTML = '<h2>Players</h2>' +
      '<div class="row" style="margin-bottom:6px;"><input type="text" id="plSearch" placeholder="find a player by username" maxlength="20" autocomplete="off"><button class="secondary" id="plGo">Open profile</button></div>' +
      '<div class="hint" id="plMsg" style="margin:0 0 10px;">Open anyone\'s profile to see if they are online and to challenge them.</div>' +
      '<div class="hint" style="margin:6px 0 2px;font-weight:700;">Online now</div><div id="plList"></div>';
    el.insertBefore(card, el.firstChild);
    var input = card.querySelector('#plSearch'), msg = card.querySelector('#plMsg');
    function go(){
      var v = input.value.trim();
      if(!NAME_RE.test(v)){ msg.textContent = 'Enter a username: 3-20 letters, numbers or underscores.'; return; }
      msg.textContent = '';
      window.openProfile(v);
    }
    card.querySelector('#plGo').onclick = go;
    input.onkeydown = function(e){ if(e.key === 'Enter') go(); };
    schedulePaint();
  }

  // =====================================================================
  //  4. challenge dialog (variant + time control + colour)
  // =====================================================================
  var D = null;
  function loadPref(){
    var d = {variant:'hb', tc:'5+3', color:'random', min:10, inc:0, custom:false};
    try{ Object.assign(d, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); }catch(e){}
    if(['hb', 'standard', 'auction'].indexOf(d.variant) < 0) d.variant = 'hb';
    if(['random', 'w', 'b'].indexOf(d.color) < 0) d.color = 'random';
    if(!/^(none|\d+\+\d+)$/.test(String(d.tc))) d.tc = '5+3';
    d.min = Math.min(180, Math.max(1, parseInt(d.min, 10) || 10)); d.inc = Math.min(60, Math.max(0, parseInt(d.inc, 10) || 0));
    return d;
  }
  function savePref(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify({variant:D.variant, tc:D.tc, color:D.color, min:D.min, inc:D.inc, custom:D.custom})); }catch(e){} }
  function tcKey(){ return D.custom ? 'c' + D.min + '+' + D.inc : D.tc; }

  function stateLine(){
    if(!D.stLoaded) return 'Checking if they are around...';
    if(D.stFailed) return 'Could not check their status.';
    var e = effOf(D.st);
    if(e.s === 'online') return 'Online. They will see your challenge right away.';
    if(e.s === 'idle') return 'Idle. They are on Pawniac but away for a moment.';
    if(e.s === 'playing') return 'In a game. They can accept once they are done (a challenge lasts 2 minutes).';
    return 'Offline' + (e.t ? ' (last seen ' + ago(e.t) + ')' : '') + '. You cannot challenge them right now.';
  }
  function offlineNow(){ return D.stLoaded && !D.stFailed && effOf(D.st).s === 'offline'; }

  function openDialog(name){
    if(!ME) return;
    if(name === ME.username){ return; }
    if(!NAME_RE.test(name)) return;
    if(inGameNow()){ flash('Finish your current game before challenging someone.'); return; }
    var p = loadPref();
    D = {to:name, variant:p.variant, tc:p.tc, color:p.color, min:p.min, inc:p.inc, custom:!!p.custom, st:null, stLoaded:false, stFailed:false};
    renderDialog();
    db.ref('hb/status/' + name).once('value').then(function(s){
      if(!D || D.to !== name) return;
      D.st = s.val(); D.stLoaded = true; renderDialog();
    }).catch(function(){
      if(!D || D.to !== name) return;
      D.stLoaded = true; D.stFailed = true; renderDialog();
    });
  }
  function closeDialog(){
    D = null;
    var ov = document.getElementById('chOv');
    if(ov && ov.parentNode) ov.parentNode.removeChild(ov);
  }
  function renderDialog(){
    if(!D) return;
    var ov = document.getElementById('chOv');
    if(!ov){
      ov = document.createElement('div');
      ov.id = 'chOv';
      ov.className = 'ch-ov';
      ov.addEventListener('mousedown', function(e){ if(e.target === ov) closeDialog(); });
      document.body.appendChild(ov);
    }
    var tcs = TIME_CONTROLS.map(function(t){
      return '<div class="tcbtn' + (!D.custom && D.tc === t.key ? ' active' : '') + '" data-tc="' + t.key + '">' + t.label + '</div>';
    }).join('') + '<div class="tcbtn' + (D.custom ? ' active' : '') + '" data-tc="custom">Custom</div>';
    var custom = D.custom
      ? '<div class="row" style="margin:6px 0 4px;"><input type="number" id="chMin" min="1" max="180" value="' + D.min + '"><span class="hint">min +</span><input type="number" id="chInc" min="0" max="60" value="' + D.inc + '"><span class="hint">sec per move</span></div>' : '';
    var colors = [['random', 'Random'], ['w', 'White'], ['b', 'Black']].map(function(c){
      return '<div class="tcbtn' + (D.color === c[0] ? ' active' : '') + '" data-co="' + c[0] + '">' + c[1] + '</div>';
    }).join('');
    ov.innerHTML = '<div class="ch-box" role="dialog" aria-label="Challenge ' + esc(D.to) + '">' +
      '<h2>Challenge ' + esc(D.to) + '</h2>' +
      '<div class="hint" style="margin:0;"><span class="st-dot st-' + (D.stLoaded && !D.stFailed ? effOf(D.st).s : 'unknown') + '"></span>' + esc(stateLine()) + '</div>' +
      '<div class="lbl">Game</div>' +
      '<div class="modes"><div class="modebtn' + (D.variant === 'hb' ? ' active' : '') + '" data-v="hb">Hand &amp; Brain<div class="hint">Name a piece, then move it</div></div>' +
      '<div class="modebtn' + (D.variant === 'standard' ? ' active' : '') + '" data-v="standard">Standard Chess<div class="hint">Normal chess rules</div></div>' + '<div class="modebtn' + (D.variant === 'auction' ? ' active' : '') + '" data-v="auction">Piece Auction<div class="hint">Bid coins, build your army</div></div></div>' +
      '<div class="lbl">Time control</div><div class="tc-row">' + tcs + '</div>' + custom +
      '<div class="lbl">You play</div><div class="tc-row">' + colors + '</div>' +
      '<div class="ch-acts"><button id="chSend"' + (offlineNow() || inGameNow() ? ' disabled' : '') + '>Send challenge</button><button class="secondary" id="chCancel">Cancel</button></div></div>';
    ov.querySelectorAll('[data-v]').forEach(function(b){ b.onclick = function(){ D.variant = b.dataset.v; savePref(); renderDialog(); }; });
    ov.querySelectorAll('[data-tc]').forEach(function(b){
      b.onclick = function(){
        if(b.dataset.tc === 'custom') D.custom = true; else { D.custom = false; D.tc = b.dataset.tc; }
        savePref(); renderDialog();
      };
    });
    ov.querySelectorAll('[data-co]').forEach(function(b){ b.onclick = function(){ D.color = b.dataset.co; savePref(); renderDialog(); }; });
    var mi = ov.querySelector('#chMin'), ii = ov.querySelector('#chInc');
    if(mi) mi.oninput = function(){ D.min = Math.min(180, Math.max(1, parseInt(mi.value, 10) || 1)); savePref(); };
    if(ii) ii.oninput = function(){ D.inc = Math.min(60, Math.max(0, parseInt(ii.value, 10) || 0)); savePref(); };
    ov.querySelector('#chCancel').onclick = closeDialog;
    ov.querySelector('#chSend').onclick = sendChallenge;
  }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && D) closeDialog(); });

  // =====================================================================
  //  5. sending a challenge, and the notifications (incoming and outgoing)
  // =====================================================================
  var OUT = null;        // the challenge you sent: {to, ref, cb, t0, state, data}
  var INC = {};          // challenges sent to you: from -> data
  var MSGS = [];         // short messages: {text, until}
  var inboxRef = null, inboxFor = null, busyAcc = false;

  function flash(text){ MSGS.push({text:text, until:Date.now() + 5000}); renderToasts(); }

  function cancelOut(silent){
    if(!OUT) return;
    var o = OUT; OUT = null;
    try{ o.ref.off('value', o.cb); }catch(e){}
    if(o.state === 'pending' || o.state === 'declined') o.ref.remove().catch(function(){});
    if(!silent) renderToasts();
  }
  async function sendChallenge(){
    if(!D || !ME) return;
    if(offlineNow() || inGameNow()) return;
    var to = D.to, data = {from:ME.username, to:to, variant:D.variant, tc:tcKey(), color:D.color, ts:TS, status:'pending'};
    savePref();
    closeDialog();
    cancelOut(true);
    var ref = db.ref('hb/challenges/' + to + '/' + ME.username);
    try{ await ref.set(data); }
    catch(e){
      console.error(e);
      flash(e && e.code === 'PERMISSION_DENIED' ? "Couldn't send: publish the new Firebase rules first." : "Couldn't send the challenge.");
      return;
    }
    var o = {to:to, ref:ref, t0:Date.now(), state:'pending', data:data, cb:null};
    OUT = o;
    o.cb = ref.on('value', function(s){
      if(OUT !== o) return;
      var v = s.val();
      if(!v){
        if(o.state === 'pending'){ o.state = 'gone'; renderToasts(); setTimeout(function(){ if(OUT === o){ OUT = null; renderToasts(); } }, 4000); }
        return;
      }
      if(v.status === 'accepted' && v.gameId){
        var gid = v.gameId;
        try{ ref.off('value', o.cb); }catch(e){}
        ref.remove().catch(function(){});
        OUT = null; renderToasts();
        currentGameId = gid;
        enterGameScreen(gid);
      } else if(v.status === 'declined' && o.state === 'pending'){
        o.state = 'declined'; renderToasts();
        setTimeout(function(){ if(OUT === o) cancelOut(false); }, 6000);
      }
    });
    renderToasts();
  }

  function colorText(c){ return c === 'w' ? 'You play Black' : (c === 'b' ? 'You play White' : 'Colours are random'); }
  function renderToasts(){
    var box = document.getElementById('chToasts');
    if(!box){ box = document.createElement('div'); box.id = 'chToasts'; document.body.appendChild(box); }
    var h = '';
    MSGS.forEach(function(m){ h += '<div class="ch-toast msg">' + esc(m.text) + '</div>'; });
    if(OUT){
      if(OUT.state === 'pending') h += '<div class="ch-toast"><div class="ct">Challenge sent to ' + esc(OUT.to) + '</div><div class="cs">' + ({standard:'Standard', auction:'Piece Auction'}[OUT.data.variant] || 'Hand & Brain') + ' &middot; ' + esc(tcLabel(OUT.data.tc)) + ' &middot; waiting for an answer (<span data-oexp="1"></span>)</div><div class="cb"><button class="secondary" data-oact="cancel">Cancel</button></div></div>';
      else if(OUT.state === 'declined') h += '<div class="ch-toast"><div class="ct">' + esc(OUT.to) + ' declined your challenge.</div></div>';
      else if(OUT.state === 'expired') h += '<div class="ch-toast"><div class="ct">' + esc(OUT.to) + ' did not answer in time.</div></div>';
      else if(OUT.state === 'gone') h += '<div class="ch-toast"><div class="ct">The challenge to ' + esc(OUT.to) + ' was withdrawn.</div></div>';
    }
    Object.keys(INC).forEach(function(f){
      var c = INC[f];
      h += '<div class="ch-toast"><div class="ct">' + esc(f) + ' challenges you!</div><div class="cs">' + ({standard:'Standard Chess', auction:'Piece Auction'}[c.variant] || 'Hand &amp; Brain') + ' &middot; ' + esc(tcLabel(c.tc)) + ' &middot; ' + colorText(c.color) +
        ' &middot; <span data-iexp="' + esc(f) + '"></span></div><div class="cb"><button data-iacc="' + esc(f) + '"' + (inGameNow() ? ' disabled title="Finish your game first"' : '') + '>Accept</button><button class="secondary" data-idec="' + esc(f) + '">Decline</button></div></div>';
    });
    box.innerHTML = h;
    box.querySelectorAll('[data-iacc]').forEach(function(b){ b.onclick = function(){ acceptChallenge(b.dataset.iacc); }; });
    box.querySelectorAll('[data-idec]').forEach(function(b){ b.onclick = function(){ declineChallenge(b.dataset.idec); }; });
    box.querySelectorAll('[data-oact="cancel"]').forEach(function(b){ b.onclick = function(){ cancelOut(false); }; });
    tickToasts();
  }
  function fmtLeft(ms){ var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
  function tickToasts(){
    var changed = false, now = Date.now();
    MSGS = MSGS.filter(function(m){ if(m.until <= now){ changed = true; return false; } return true; });
    Object.keys(INC).forEach(function(f){
      var left = EXPIRE_MS - (serverNow() - INC[f].ts);
      if(left <= 0){
        delete INC[f]; changed = true;
        if(inboxRef) inboxRef.child(f).remove().catch(function(){});
      } else {
        var s = document.querySelector('[data-iexp="' + f + '"]');
        if(s) s.textContent = fmtLeft(left) + ' left';
        var acc = document.querySelector('[data-iacc="' + f + '"]');
        if(acc) acc.disabled = inGameNow();
      }
    });
    if(OUT && OUT.state === 'pending'){
      var l2 = EXPIRE_MS - (now - OUT.t0);
      if(l2 <= 0){
        OUT.state = 'expired'; changed = true;
        try{ OUT.ref.remove().catch(function(){}); }catch(e){}
        try{ OUT.ref.off('value', OUT.cb); }catch(e){}
        var o2 = OUT; setTimeout(function(){ if(OUT === o2){ OUT = null; renderToasts(); } }, 5000);
      } else {
        var s2 = document.querySelector('[data-oexp]');
        if(s2) s2.textContent = fmtLeft(l2) + ' left';
      }
    }
    if(changed) renderToasts();
  }

  // ---- incoming ----
  function attachInbox(){
    detachInbox();
    inboxFor = ME.username;
    inboxRef = db.ref('hb/challenges/' + ME.username);
    var upd = function(s){
      var v = s.val();
      if(!v || v.status !== 'pending' || typeof v.ts !== 'number'){ delete INC[s.key]; renderToasts(); return; }
      if(serverNow() - v.ts > EXPIRE_MS){ delete INC[s.key]; inboxRef.child(s.key).remove().catch(function(){}); renderToasts(); return; }
      var isNew = !INC[s.key];
      INC[s.key] = v;
      if(isNew) try{ playGameStartSound(); }catch(e){}
      renderToasts();
    };
    inboxRef.on('child_added', upd);
    inboxRef.on('child_changed', upd);
    inboxRef.on('child_removed', function(s){ delete INC[s.key]; renderToasts(); });
  }
  function detachInbox(){
    try{ if(inboxRef) inboxRef.off(); }catch(e){}
    inboxRef = null; inboxFor = null; INC = {};
  }
  async function declineChallenge(from){
    var ref = db.ref('hb/challenges/' + ME.username + '/' + from);
    delete INC[from]; renderToasts();
    try{
      var v = (await ref.once('value')).val();
      if(v) await ref.update({status:'declined'});
      setTimeout(function(){ ref.remove().catch(function(){}); }, 8000);
    }catch(e){ console.error(e); }
  }
  async function acceptChallenge(from){
    if(busyAcc || !ME) return;
    if(inGameNow()){ flash('Finish your current game first.'); return; }
    busyAcc = true;
    try{
      var ref = db.ref('hb/challenges/' + ME.username + '/' + from);
      var c = (await ref.once('value')).val();
      if(!c || c.status !== 'pending' || serverNow() - c.ts > EXPIRE_MS){ delete INC[from]; renderToasts(); flash('That challenge is no longer available.'); return; }
      var sst = (await db.ref('hb/status/' + from).once('value')).val();
      if(effOf(sst).s === 'offline'){
        delete INC[from]; renderToasts();
        ref.remove().catch(function(){});
        flash(from + ' has gone offline, so the challenge was cancelled.');
        return;
      }
      var std = c.variant === 'standard', lbp = std ? 'hb:leaderboardStd:' : 'hb:leaderboard:';
      var mp = (await kget(lbp + ME.username, true)) || {rating:1200, games:0};
      var op = (await kget(lbp + from, true)) || {rating:1200, games:0};
      var meWhite = c.color === 'random' ? Math.random() < 0.5 : (c.color === 'b');   // their colour choice is theirs: 'w' means THEY play White
      var seats = meWhite ? {white:ME.username, black:from} : {white:from, black:ME.username};
      var code = genCode();
      var game = {
        mode:'random', status:'active', fen:new Chess().fen(), turn:'w', announced:std ? 'std' : null,
        moveLog:[], winner:null, drawOffer:'', clock:freshClock(c.tc), seats:seats,
        ratingSnapshot: meWhite ? {white:mp.rating, black:op.rating} : {white:op.rating, black:mp.rating}, wantAuction: c.variant === 'auction'
      };
      if(std) game.variant = 'standard';
      var saved = await kset('hb:game:' + code, game, true);
      if(!saved){ flash("Couldn't start the game."); return; }
      await ref.update({status:'accepted', gameId:code});
      delete INC[from]; renderToasts();
      currentGameId = code;
      enterGameScreen(code);
    }catch(e){
      console.error('accept failed', e);
      flash("Couldn't accept the challenge.");
    }finally{ busyAcc = false; }
  }

  // =====================================================================
  //  6. profile pages
  // =====================================================================
  function decorateProfile(name){
    var scr = document.getElementById('screen-profile');
    var nameEl = scr && scr.querySelector('.pf-name');
    if(!scr || scr.style.display !== 'block' || !nameEl || nameEl.textContent.indexOf(name) !== 0) return;
    if(scr.querySelector('.pf-status')) return;
    var row = document.createElement('div');
    row.className = 'pf-status';
    row.innerHTML = dotHtml(name) + '<span class="st-txt" data-stfull="' + esc(name) + '" style="font-size:13px;opacity:.85;"></span>';
    nameEl.after(row);
    if(ME && name !== ME.username){
      var tmp = document.createElement('span');
      tmp.innerHTML = chBtnHtml(name);
      var btn = tmp.firstChild;
      btn.onclick = function(){ openDialog(name); };
      row.appendChild(btn);
    }
    schedulePaint();
  }

  // =====================================================================
  //  7. hooks into the rest of the page
  // =====================================================================
  var prevShow = window.showScreen;
  window.showScreen = function(n){
    prevShow(n);
    if(n === 'leaderboard' || n === 'profile' || n === 'minigames') feedOn(); else feedOff();
  };
  var prevLb = window.renderLeaderboard;
  window.renderLeaderboard = async function(){
    var r = await prevLb.apply(this, arguments);
    try{ addPlayersCard(); }catch(e){ console.error('players card failed', e); }
    return r;
  };
  var prevOpen = window.openProfile;
  window.openProfile = async function(name){
    var r = await prevOpen.apply(this, arguments);
    try{ decorateProfile(name); }catch(e){ console.error('profile status failed', e); }
    return r;
  };
  var prevLogout = window.logout;
  window.logout = async function(){
    try{ cancelOut(true); detachInbox(); closeDialog(); renderToasts(); }catch(e){}
    try{
      var p = stopOwn(true);
      if(p) await Promise.race([p, new Promise(function(r){ setTimeout(r, 1500); })]);
    }catch(e){}
    return prevLogout();
  };

  // one timer drives everything
  var n10 = 0;
  setInterval(function(){
    try{
      if(ME){
        if(inboxFor !== ME.username) attachInbox();
        if(++n10 % 10 === 0 || meName !== ME.username) ownTick();   // every 10s (and right away after login)
      } else if(inboxFor){
        detachInbox(); renderToasts();
      }
      tickToasts();
    }catch(e){ console.error('status tick failed', e); }
  }, 1000);
})();

<script>
(function(){
  var T=['p','n','b','r','q'];
  var GL={p:'\u265F\uFE0E',n:'\u265E\uFE0E',b:'\u265D\uFE0E',r:'\u265C\uFE0E',q:'\u265B\uFE0E',k:'\u265A\uFE0E'};
  var NM={p:'Pawn',n:'Knight',b:'Bishop',r:'Rook',q:'Queen',k:'King'};
  var VALS={p:1,n:3,b:3,r:5,q:9};
  var LIM={nominate:25000,bid:25000,place:90000};   // seconds before an idle player is auto-handled
  var auc=false, PL=null, busy=false;

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function opp(s){return s==='w'?'b':'w';}
  function nm(g,s){return g.seats[s==='w'?'white':'black']||'';}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

  // ================= auction rules =================
  // capacity: pawns on rank 2 (max 8), everything else shares the back rank with the king (max 7)
  function roomFor(au,s,t){var b=au.bought[s];return t==='p'?b.p<8:(b.n+b.b+b.r+b.q)<7;}
  function canBid(au,s,t,min){return !au.done[s]&&roomFor(au,s,t)&&au.coins[s]>=min;}
  function canNom(au,s){return !au.done[s]&&au.coins[s]>=1&&T.some(function(t){return roomFor(au,s,t);});}
  function nomOk(au,t){return canBid(au,'w',t,1)||canBid(au,'b',t,1);}

  function startNom(au){
    au.item='';au.bid=0;au.bidder='';au.np=0;au.phase='nominate';
    if(au.unsold>=3||au.round>=60||(!canNom(au,'w')&&!canNom(au,'b'))){au.phase='place';au.turn='';au.turnAt=serverNow();return;}
    if(!canNom(au,au.nom)) au.nom=opp(au.nom);
    au.turn=au.nom;au.turnAt=serverNow();
  }
  function sell(au,w){
    au.coins[w]-=au.bid;au.bought[w][au.item]++;
    au.lastW=w;au.lastT=au.item;au.lastBid=au.bid;
    au.unsold=0;au.round++;au.nom=opp(au.nom);startNom(au);
  }
  function noSale(au){
    au.lastW='';au.lastT=au.item;au.lastBid=0;
    au.unsold++;au.round++;au.nom=opp(au.nom);startNom(au);
  }
  function doAct(au,s,a){
    if(au.phase==='nominate'){
      if(au.turn!==s) return false;
      if(a.k==='stop'){au.done[s]=true;startNom(au);return true;}
      if(a.k==='nom'&&T.indexOf(a.t)>=0&&nomOk(au,a.t)&&canNom(au,s)){
        au.item=a.t;au.bid=0;au.bidder='';au.np=0;au.phase='bid';au.turnAt=serverNow();
        if(canBid(au,s,a.t,1)) au.turn=s; else {au.turn=opp(s);au.np=1;}
        return true;
      }
      return false;
    }
    if(au.phase==='bid'){
      if(au.turn!==s) return false;
      var o=opp(s);
      if(a.k==='bid'){
        var x=Math.floor(a.x);
        if(!(x>au.bid)||!canBid(au,s,au.item,x)) return false;
        au.bid=x;au.bidder=s;au.np=0;au.turnAt=serverNow();
        if(canBid(au,o,au.item,x+1)) au.turn=o; else sell(au,s);
        return true;
      }
      if(a.k==='pass'){
        if(au.bidder){sell(au,au.bidder);return true;}
        au.np++;
        if(au.np>=2||!canBid(au,o,au.item,1)) noSale(au); else {au.turn=o;au.turnAt=serverNow();}
        return true;
      }
    }
    return false;
  }

  // ================= layouts + starting position =================
  function validPlace(au,s,str){
    var m=/^([KQRBN.]{8})\|([P.]{8})$/.exec(str||''); if(!m) return false;
    var b=au.bought[s],c={K:0,Q:0,R:0,B:0,N:0};
    m[1].split('').forEach(function(ch){if(ch!=='.')c[ch]++;});
    var pc=m[2].split('').filter(function(ch){return ch==='P';}).length;
    return c.K===1&&c.Q===b.q&&c.R===b.r&&c.B===b.b&&c.N===b.n&&pc===b.p;
  }
  function randLayout(b){
    var back=['','','','','','','',''],pw=[0,0,0,0,0,0,0,0],list=['k'];
    ['q','r','b','n'].forEach(function(t){for(var i=0;i<b[t];i++)list.push(t);});
    var slots=shuffle([0,1,2,3,4,5,6,7]);list.forEach(function(t,i){back[slots[i]]=t;});
    var files=shuffle([0,1,2,3,4,5,6,7]);for(var i=0;i<b.p;i++)pw[files[i]]=1;
    return {back:back,pawns:pw};
  }
  function toStr(L){return L.back.map(function(x){return x?x.toUpperCase():'.';}).join('')+'|'+L.pawns.map(function(x){return x?'P':'.';}).join('');}
  function rowFen(str,upper){
    var o='',e=0;
    str.split('').forEach(function(c){
      if(c==='.'){e++;}else{if(e){o+=e;e=0;}o+=upper?c.toUpperCase():c.toLowerCase();}
    });
    return o+(e?e:'');
  }
  function finalize(g){
    var au=g.auction,w=au.place.w.split('|'),b=au.place.b.split('|');
    var fen=rowFen(b[0],false)+'/'+rowFen(b[1],false)+'/8/8/8/8/'+rowFen(w[1],true)+'/'+rowFen(w[0],true)+' w - - 0 1',turn='w';
    try{
      // if only Black's king starts in check, Black moves first so the position stays legal
      var bIn=new Chess(fen.replace(' w ',' b ')).in_check(),wIn=new Chess(fen).in_check();
      if(bIn&&!wIn){turn='b';fen=fen.replace(' w ',' b ');}
    }catch(e){}
    au.phase='done';au.turn='';
    g.fen=fen;g.turn=turn;g.status='active';g.announced='std';
    g.moveAt=serverNow();g.moveCount=0;
    g.statsApplied={};g.statsApplied[g.seats.white]=true;g.statsApplied[g.seats.black]=true;   // auction games don't touch W/L records
  }

  // ================= game creation =================
  function newAuctionGame(seats,tc,status){
    var B=15+Math.floor(Math.random()*36);   // 15..50 coins, same for both players
    var z=function(){return {p:0,n:0,b:0,r:0,q:0};};
    return {mode:'random',variant:'auction',status:status||'waiting',fen:new Chess().fen(),turn:'w',announced:'std',
      moveLog:[],winner:null,drawOffer:'',clock:freshClock(tc),seats:seats,
      auction:{budget:B,coins:{w:B,b:B},bought:{w:z(),b:z()},done:{w:false,b:false},nom:'w',phase:'nominate',item:'',bid:0,bidder:'',
        turn:'w',np:0,unsold:0,round:0,turnAt:serverNow(),lastW:'',lastT:'',lastBid:0,place:{w:'',b:''}}};
  }
  async function createAuctionRoom(){
    var code=genCode();
    await kset('hb:game:'+code,newAuctionGame({white:'',black:''},selectedTC,'waiting'),true);
    currentGameId=code;renderWaiting(code);
  }
  async function auctionQuick(){
    var hint=document.getElementById('quickHint');
    if(hint) hint.innerHTML='Searching... <span class="backlink" id="btnCancelQuick">cancel</span>';
    var cb=document.getElementById('btnCancelQuick');if(cb) cb.onclick=cancelQuickMatch;
    document.getElementById('btnQuick').disabled=true;
    var snap=await db.ref('hb/queue/random').once('value'),q=snap.exists()?snap.val():{},now=serverNow();
    var cand=Object.keys(q).find(function(u){return u!==ME.username&&!q[u].gameId&&q[u].tc===selectedTC&&q[u].variant==='auction'&&(now-q[u].joinedAt)<60000;});
    if(cand){
      var code=genCode(),meW=Math.random()<0.5;
      var game=newAuctionGame(meW?{white:ME.username,black:cand}:{white:cand,black:ME.username},selectedTC,'auction');
      await kset('hb:game:'+code,game,true);
      await db.ref('hb/queue/random/'+cand+'/gameId').set(code);
      await db.ref('hb/queue/random/'+ME.username).remove();
      currentGameId=code;enterGameScreen(code);
    }else{
      var me=db.ref('hb/queue/random/'+ME.username);
      await me.set({joinedAt:now,gameId:'',tc:selectedTC,variant:'auction'});
      me.onDisconnect().remove();
      activeListenerRef=db.ref('hb/queue/random/'+ME.username+'/gameId');
      activeListenerRef.on('value',function(s){
        var gid=s.val();
        if(gid){stopPoll();db.ref('hb/queue/random/'+ME.username).remove();currentGameId=gid;enterGameScreen(gid);}
      });
    }
  }

  // ================= talking to the database =================
  function actTx(gid,fn){
    return db.ref(dbPath('hb:game:'+gid)).transaction(function(cur){
      if(!cur) return cur;
      if(cur.status!=='auction'||!cur.auction) return;
      return fn(cur)?cur:undefined;
    }).catch(function(e){console.error('auction write failed',e);});
  }
  function send(a){
    var gid=currentGameId,me=gameState&&myRole(gameState);if(!me) return;var s=me.side;
    actTx(gid,function(g){
      var au=g.auction;
      if(a.k==='place'){
        if(au.phase!=='place'||au.place[s]||!validPlace(au,s,a.str)) return false;
        au.place[s]=a.str;if(au.place.w&&au.place.b) finalize(g);return true;
      }
      return doAct(au,s,a);
    });
  }
  function abortAuction(){
    actTx(currentGameId,function(g){
      g.status='finished';g.winner='abort';g.statusNote='auction aborted';
      g.statsApplied={};g.statsApplied[g.seats.white]=true;g.statsApplied[g.seats.black]=true;return true;
    });
  }
  function timeoutTx(ph,gid){
    actTx(gid,function(g){
      var au=g.auction;
      if(au.phase!==ph||serverNow()-au.turnAt<=LIM[ph]) return false;
      if(ph==='nominate'){
        var ok=T.filter(function(t){return nomOk(au,t);});
        return ok.length>0&&doAct(au,au.turn,{k:'nom',t:ok[Math.floor(Math.random()*ok.length)]});
      }
      if(ph==='bid') return doAct(au,au.turn,{k:'pass'});
      ['w','b'].forEach(function(s){if(!au.place[s]) au.place[s]=toStr(randLayout(au.bought[s]));});
      finalize(g);return true;
    });
  }
  setInterval(function(){
    var g=gameState,scr=document.getElementById('screen-game');
    if(!g||g.variant!=='auction'||g.status!=='auction'||!scr||scr.style.display!=='block'||!myRole(g)) return;
    var au=g.auction,lim=LIM[au.phase];if(!lim) return;
    var left=lim-(serverNow()-au.turnAt),el=document.getElementById('auTimer');
    if(el) el.textContent=Math.max(0,Math.ceil(left/1000))+'s';
    if(left>-1000||busy) return;
    busy=true;setTimeout(function(){busy=false;},4000);
    timeoutTx(au.phase,currentGameId);
  },1000);

  // ================= drawing =================
  function pieceSpan(t,side){return '<span class="au-g '+(side==='w'?'wh':'bk')+'">'+GL[t]+'</span>';}
  function panel(g,au,s,my,isMe){
    var b=au.bought[s];
    var army=['q','r','b','n','p'].map(function(t){return b[t]?'<span class="au-pc">'+GL[t]+'<b>\u00d7'+b[t]+'</b></span>':'';}).join('')||'<span class="hint">no pieces yet</span>';
    return '<div class="au-p'+(isMe?' me':'')+'"><div class="au-nm">'+esc(nm(g,s))+(isMe?' (you)':'')+'</div><div class="au-coins">'+au.coins[s]+' <small>coins</small></div>'+
      '<div class="au-army">'+army+'</div><div class="hint">'+(b.n+b.b+b.r+b.q)+'/7 pieces &middot; '+b.p+'/8 pawns'+(au.done[s]?' &middot; stopped buying':'')+'</div></div>';
  }
  function slotRow(strOrArr,isPawn,my,editable){
    var h='<div class="au-row">';
    for(var i=0;i<8;i++){
      var v=isPawn?(typeof strOrArr==='string'?(strOrArr.charAt(i)==='P'?'p':''):(strOrArr[i]?'p':'')):(typeof strOrArr==='string'?(strOrArr.charAt(i)==='.'?'':strOrArr.charAt(i).toLowerCase()):strOrArr[i]);
      h+='<div class="au-slot '+((i+(isPawn?1:0))%2?'dk':'lt')+'"'+(editable?' data-'+(isPawn?'pawn':'back')+'="'+i+'"':'')+'>'+(v?pieceSpan(v,my):'')+'</div>';
    }
    return h+'</div>';
  }
  function used(){
    var u={k:0,q:0,r:0,b:0,n:0,p:0};
    PL.back.forEach(function(x){if(x)u[x]++;});PL.pawns.forEach(function(x){if(x)u.p++;});return u;
  }
  function placeHtml(au,my){
    var b=au.bought[my];
    if(au.place[my]){
      var p=au.place[my].split('|');
      return '<div class="au-lot"><div style="margin-bottom:6px;"><b>Your army is locked in.</b> Waiting for your opponent...</div>'+slotRow(p[1],true,my,false)+slotRow(p[0],false,my,false)+'</div>';
    }
    if(!PL||PL.gid!==currentGameId) PL={gid:currentGameId,back:['','','','','','','',''],pawns:[0,0,0,0,0,0,0,0],sel:null};
    var tot={k:1,q:b.q,r:b.r,b:b.b,n:b.n,p:b.p},u=used();
    var tray=['k','q','r','b','n','p'].filter(function(t){return tot[t]>0;}).map(function(t){
      var left=tot[t]-u[t];
      return '<button class="'+(PL.sel===t?'':'secondary')+'" data-sel="'+t+'"'+(left<=0?' disabled':'')+'>'+pieceSpan(t,my)+' '+NM[t]+' \u00d7'+left+'</button>';
    }).join('');
    var all=Object.keys(tot).every(function(t){return u[t]===tot[t];});
    return '<div class="au-lot"><div style="margin-bottom:6px;"><b>Place your army</b> <span class="hint">(<span id="auTimer"></span>)</span></div>'+
      '<div class="hint">Pick a piece, then a square. Click a placed piece to take it back. Pawns go on your 2nd rank, everything else on your back rank.</div>'+
      '<div class="au-acts">'+tray+'</div>'+
      '<div class="hint" style="margin-top:10px;">Pawn rank</div>'+slotRow(PL.pawns,true,my,true)+
      '<div class="hint">Back rank</div>'+slotRow(PL.back,false,my,true)+
      '<div class="au-acts"><button class="secondary" id="auRand">Randomize</button><button class="secondary" id="auClear">Clear</button><button id="auLock"'+(all?'':' disabled')+'>Lock in</button></div></div>';
  }

        (au.bidder?'Current bid: <b>'+au.bid+'</b> by '+esc(nm(g,au.bidder)):'No bids yet')+'</div>';
      if(mine){

      }else body+='<div class="hint">Waiting for '+turnName+timer+'</div>';

    }
    el.innerHTML='<div class="card"><h2>Piece Auction</h2><p class="desc">Everyone always has a king. Bid coins for pieces one at a time ('+au.budget+' coins each this game). Pawns go on the 2nd rank and everything else shares the back rank with the king, so you can hold at most 8 pawns and 7 other pieces.</p>'+
      '<div class="au-top">'+panel(g,au,my,my,!!me)+panel(g,au,o,my,false)+'</div>'+(last?'<p class="au-last">'+last+'</p>':'')+body+
      (me?'<div style="margin-top:12px;"><span class="backlink" id="auAbort">Abort game</span></div>':'')+'</div>';

    el.querySelectorAll('[data-nom]').forEach(function(b){b.onclick=function(){send({k:'nom',t:b.dataset.nom});};});
    el.querySelectorAll('[data-stop]').forEach(function(b){b.onclick=function(){send({k:'stop'});};});
    var bb=document.getElementById('auBidBtn'),inp=document.getElementById('auBid');
    function doBid(){bb.disabled=true;send({k:'bid',x:parseInt(inp.value,10)});}
    if(bb){bb.onclick=doBid;inp.onkeydown=function(e){if(e.key==='Enter')doBid();};}
    var ps=document.getElementById('auPass');if(ps) ps.onclick=function(){ps.disabled=true;send({k:'pass'});};
    var ab=document.getElementById('auAbort');if(ab) ab.onclick=function(){if(confirm('Abort this game? No result for either player.'))abortAuction();};
    if(au.phase==='place'&&me&&!au.place[my]&&PL){
      var b=au.bought[my],tot={k:1,q:b.q,r:b.r,b:b.b,n:b.n,p:b.p};
      el.querySelectorAll('[data-sel]').forEach(function(x){x.onclick=function(){PL.sel=(PL.sel===x.dataset.sel?null:x.dataset.sel);drawGame();};});
      el.querySelectorAll('[data-back]').forEach(function(x){x.onclick=function(){

        else if(PL.sel&&PL.sel!=='p'&&used()[PL.sel]<tot[PL.sel]){PL.back[i]=PL.sel;if(used()[PL.sel]>=tot[PL.sel])PL.sel=null;}

      document.getElementById('auRand').onclick=function(){var L=randLayout(b);PL.back=L.back;PL.pawns=L.pawns;PL.sel=null;drawGame();};
      document.getElementById('auClear').onclick=function(){PL.back=['','','','','','','',''];PL.pawns=[0,0,0,0,0,0,0,0];PL.sel=null;drawGame();};

<script>
(function(){
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // same game object step 22 builds (challenges need it)
  window.__newAuctionGame=function(seats,tc,status){
    var B=15+Math.floor(Math.random()*36),z=function(){return {p:0,n:0,b:0,r:0,q:0};};
    return {mode:'random',variant:'auction',status:status||'waiting',fen:new Chess().fen(),turn:'w',announced:'std',
      moveLog:[],winner:null,drawOffer:'',clock:freshClock(tc),seats:seats,
      auction:{budget:B,coins:{w:B,b:B},bought:{w:z(),b:z()},done:{w:false,b:false},nom:'w',phase:'nominate',item:'',bid:0,bidder:'',
        turn:'w',np:0,unsold:0,round:0,turnAt:serverNow(),lastW:'',lastT:'',lastBid:0,place:{w:'',b:''}}};
  };

  // ---------- 1. rating snapshot when both seats are filled ----------
  var pk=window.kset;
  window.kset=async function(key,value,shared){
    try{
      if(shared!==false&&typeof key==='string'&&key.indexOf('hb:game:')===0&&value&&typeof value==='object'){
        if(value.wantAuction){   // game accepted from a challenge: turn it into an auction game
          var ag=window.__newAuctionGame(value.seats,(value.clock&&value.clock.tcKey)||'none','auction');
          Object.keys(value).forEach(function(k){delete value[k];});
          Object.assign(value,ag);
        }
        if(value.variant==='auction'&&!value.ratingSnapshot&&value.seats&&value.seats.white&&value.seats.black){
          var a=(await kget('hb:leaderboardAuc:'+value.seats.white,true))||{rating:1200,games:0};
          var b=(await kget('hb:leaderboardAuc:'+value.seats.black,true))||{rating:1200,games:0};
          value.ratingSnapshot={white:a.rating,black:b.rating};
        }
      }
    }catch(e){console.error('auction rating snapshot failed',e);}
    return pk(key,value,shared);
  };

  // ---------- 2. rating change at the end of the game ----------
  var ps=window.settleMyRating;
  window.settleMyRating=async function(g){
    if(!g||g.variant!=='auction') return ps(g);
    if(g.mode!=='random'||g.status!=='finished'||!g.ratingSnapshot||!g.winner||g.winner==='abort') return;
    var gid=currentGameId,me=myRole(g);if(!me) return;
    var side=me.side;
    if(myRatingChangeCache[gid]||settlingGames[gid]) return;
    if(g.ratingApplied&&g.ratingApplied[side]) return;
    settlingGames[gid]=true;
    var myStart=side==='w'?g.ratingSnapshot.white:g.ratingSnapshot.black;
    var oppStart=side==='w'?g.ratingSnapshot.black:g.ratingSnapshot.white;
    var change=computeEloChange(myStart,oppStart,scoreForSide(g.winner,side));
    var path='hb:leaderboardAuc:'+ME.username;
    var prof=(await kget(path,true))||{rating:myStart,games:0};
    var newRating=prof.rating+change;
    myRatingChangeCache[gid]={change:change,newRating:newRating};
    await kset(path,{rating:newRating,games:prof.games+1},true);
    await db.ref(dbPath('hb:game:'+gid+'/ratingApplied/'+side)).set(true);
    if(gameState&&currentGameId===gid) drawGame();
  };

  // result banner shows "Updating rating..." (step 22 removed it)
  var pd=window.drawGame;
  window.drawGame=function(){
    pd();
    try{
      var g=gameState;
      if(!g||g.variant!=='auction'||g.status!=='finished'||g.winner==='abort'||!myRole(g)) return;
      var bn=document.querySelector('#screen-game .result-banner');if(!bn) return;
      var has=Array.prototype.some.call(bn.querySelectorAll('.rc'),function(d){return /^You:|^Updating/.test(d.textContent);});
      if(!has){var d=document.createElement('div');d.className='rc';d.textContent='Updating rating...';bn.appendChild(d);}
    }catch(e){console.error(e);}
  };

  // ---------- 3. lobby text: rated + your rating ----------
  var pl=window.renderLobby;
  window.renderLobby=function(){
    pl();
    try{
      var el=document.getElementById('screen-lobby');
      if(!el.querySelector('[data-variant="auction"].active')) return;
      var qd=document.getElementById('btnQuick').closest('.card').querySelector('p.desc');
      if(qd) qd.textContent=qd.textContent.replace('Unrated.','Rated.');
      var h=Array.prototype.filter.call(el.querySelectorAll('.hint'),function(x){return x.textContent==='Piece Auction games are unrated.';})[0];
      if(h) kget('hb:leaderboardAuc:'+ME.username,true).then(function(p){
        p=p||{rating:1200,games:0};h.textContent='Your Piece Auction rating: '+p.rating+' \u00b7 '+p.games+' games';
      });
    }catch(e){console.error(e);}
  };

  // ---------- 4. leaderboard tab ----------
  var plb=window.renderLeaderboard;
  window.renderLeaderboard=async function(v){
    var r=await plb.apply(this,arguments);
    try{
      var scr=document.getElementById('screen-leaderboard');
      var first=scr.querySelector('.modes [data-v]');if(!first) return r;
      var modes=first.parentNode,card=modes.closest('.card');
      if(!modes.querySelector('[data-v="auction"]')){
        var t=document.createElement('div');t.className='modebtn';t.dataset.v='auction';t.textContent='Piece Auction';
        t.onclick=function(){window.renderLeaderboard('auction');};modes.appendChild(t);
      }
      if(v==='auction'){
        modes.querySelectorAll('[data-v]').forEach(function(x){x.classList.toggle('active',x.dataset.v==='auction');});
        var snap=await db.ref('hb/leaderboardAuc').once('value'),users=snap.exists()?snap.val():{};
        var rows=Object.keys(users).map(function(u){return {username:u,rating:users[u].rating||1200,games:users[u].games||0};})
          .filter(function(u){return u.games>0;}).sort(function(a,b){return b.rating-a.rating;}).slice(0,50);
        while(modes.nextSibling) card.removeChild(modes.nextSibling);
        card.insertAdjacentHTML('beforeend','<p class="desc">Ranked by rating. Only rated Piece Auction games count.</p>'+
          (rows.length?rows.map(function(u,i){
            return '<div class="seat"><span class="who">#'+(i+1)+' '+esc(u.username)+(u.username===ME.username?' (you)':'')+'</span><span class="taken">'+u.rating+' &middot; '+u.games+' games</span></div>';
          }).join(''):'<p class="desc">No rated Piece Auction games yet.</p>'));
      }
    }catch(e){console.error('auction leaderboard failed',e);}
    return r;
  };

  // ---------- 5. rating on profiles ----------
  var po=window.openProfile;
  window.openProfile=async function(name){
    var r=await po.apply(this,arguments);
    try{
      var scr=document.getElementById('screen-profile'),gr=scr.querySelector('.pf-grid'),nm=scr.querySelector('.pf-name');
      if(gr&&nm&&nm.textContent.indexOf(name)===0&&!gr.querySelector('[data-auc]')){
        var v=(await db.ref('hb/leaderboardAuc/'+name).once('value')).val();
        if(!gr.querySelector('[data-auc]')){
          var d=document.createElement('div');d.className='pf-box';d.dataset.auc='1';
          d.innerHTML='<div class="hint">Piece Auction</div><div class="pf-big">'+(v?v.rating:'-')+'</div><div class="hint">'+(v?v.games:0)+' games</div>';
          gr.appendChild(d);
        }
      }
    }catch(e){console.error(e);}
    return r;
  };
})();
</script>

<style>

<script>
(function(){
  var MAXL=29, LIVES=3, FILES='abcdefgh';
  var PAL=['wk','wq','wr','wb','wn','wp','bk','bq','br','bb','bn','bp'];
  var S={phase:'idle',level:1,rl:1,lives:LIVES,score:0,n:4,pos:null,placed:{},sel:null,secs:0,t0:0,timer:null,seen:{},
         best:null,bestLoaded:false,msg:'',marks:null,last:0,next:'round',done:false,newBest:false,perfect:false,rid:0};

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function nPieces(l){return 3+l;}                       // level 1 = 4 pieces (both kings count)
  function secsFor(l){var n=nPieces(l);return Math.max(3,Math.round((2+n*0.6-(l-1)*0.1)*10)/10);}
  function bestTxt(){return S.best?S.best.score+' points (level '+S.best.level+')':'none yet';}

  // ---------- realistic positions: random played-out games ----------
  function count(c){var n=0;c.board().forEach(function(r){r.forEach(function(p){if(p)n++;});});return n;}
  function toMap(c){var m={};c.board().forEach(function(row,r){row.forEach(function(p,f){if(p)m[FILES[f]+(8-r)]=p.color+p.type;});});return m;}
  function keyOf(m){return Object.keys(m).sort().map(function(k){return k+m[k];}).join(',');}
  function gen(n){
    for(var a=0;a<40;a++){
      var c=new Chess(),plies=0,minP=10+Math.floor(Math.random()*14),ok=true;
      while(plies<260){
        var cnt=count(c);
        if(cnt===n&&plies>=minP) break;
        if(c.game_over()){ok=false;break;}
        var caps=[],quiet=[];
        c.moves({verbose:true}).forEach(function(m){(m.captured?caps:quiet).push(m);});
        var pool;
        if(cnt>n) pool=(plies>=6&&caps.length&&Math.random()<0.55)?caps:(quiet.length?quiet:caps);
        else pool=quiet;                                  // already at the target: no more captures
        if(!pool.length){ok=false;break;}
        c.move(pool[Math.floor(Math.random()*pool.length)]);
        plies++;
      }
      if(ok&&plies<260&&count(c)===n) return toMap(c);
    }
    // fallback: a quiet opening position, thinned out (kings always stay)
    var c2=new Chess();
    for(var i=0;i<24;i++){
      var q=c2.moves({verbose:true}).filter(function(m){return !m.captured;});
      if(!q.length) break;
      c2.move(q[Math.floor(Math.random()*q.length)]);
    }
    var m2=toMap(c2),keys=Object.keys(m2).filter(function(k){return m2[k].charAt(1)!=='k';});
    keys.sort(function(){return Math.random()-.5;});
    while(Object.keys(m2).length>n&&keys.length) delete m2[keys.pop()];
    return m2;
  }

  // ---------- drawing ----------
  function pimg(code){
    var c=code.charAt(0),t=code.charAt(1);
    return '<img class="piece-img" src="'+pieceImgUrl(c,t)+'" alt="" draggable="false" onerror="this.outerHTML=\'<span style=&quot;font-size:1em;line-height:1;&quot;>'+PIECE_UNICODE[c][t]+'</span>\'">';
  }
  function boardHtml(map,marks){
    var h='<div class="board">';
    for(var r=0;r<8;r++)for(var f=0;f<8;f++){
      var sq=FILES[f]+(8-r),cls='sq '+(((r+f)%2===0)?'light':'dark');
      if(marks&&marks[sq]) cls+=' bb-'+marks[sq];
      var co='';
      if(f===0) co+='<span class="coord rank">'+(8-r)+'</span>';
      if(r===7) co+='<span class="coord file">'+FILES[f]+'</span>';
      h+='<div class="'+cls+'" data-bsq="'+sq+'">'+co+(map[sq]?pimg(map[sq]):'')+'</div>';
    }
    return h+'</div>';
  }
  function palHtml(){
    function row(c){
      return '<div class="bb-pal">'+PAL.filter(function(p){return p.charAt(0)===c;}).map(function(p){
        return '<div class="tcbtn'+(S.sel===p?' active':'')+'" data-p="'+p+'">'+pimg(p)+'</div>';
      }).join('')+'</div>';
    }
    return row('w')+row('b');
  }
  function infoCard(){
    var over=S.phase==='over';
    return '<div class="card"><h2>Blindfold board</h2>'+
      (over?'<div class="result-banner">'+(S.done?'Perfect run!':'Run over')+'<div class="rc">Score '+S.score+' &middot; reached level '+S.rl+' ('+nPieces(S.rl)+' pieces)'+(S.newBest?' &middot; new personal best!':'')+'</div></div>':'')+
      '<p class="desc">A position from a played-out game is shown for a few seconds, then the pieces vanish. Place them back from memory. A perfect round takes you up a level (one more piece, a little less time per piece). A mistake costs a life, and 3 lives ends the run. Your score is the total number of pieces you placed correctly.</p>'+
      '<div class="status-msg">Your best: '+esc(bestTxt())+'</div><button id="bbStart">'+(over?'Play again':'Start')+'</button></div>';
  }
  function draw(){
    var el=document.getElementById('bbGame');if(!el) return;
    if(S.phase==='idle'||S.phase==='over'){el.innerHTML=infoCard();wire(el);return;}
    var hearts='';for(var i=0;i<LIVES;i++) hearts+=(i<S.lives?'\u2665 ':'\u2661 ');
    var head='<div class="announce'+(S.phase==='show'?'':' empty')+'">Level '+S.rl+' &middot; '+S.n+' pieces</div>'+
             '<div class="status-msg">Lives '+hearts+'&middot; Score '+S.score+'</div>';
    var map,marks=null,panel;
    if(S.phase==='show'){
      map=S.pos;
      panel=head+'<div class="bb-bar"><div id="bbBarIn"></div></div><div class="hint">Memorize it! <b id="bbLeft"></b> left</div>'+
        '<div class="bb-btns"><button class="secondary" id="bbHide">Hide now</button></div>';
    }else if(S.phase==='recall'){
      map=S.placed;
      panel=head+'<div class="hint" style="margin-bottom:8px;">Pick a piece, then click a square. Click a placed piece (with nothing picked) to remove it.</div>'+palHtml()+
        '<div class="hint">Placed '+Object.keys(S.placed).length+' / '+S.n+'</div>'+(S.msg?'<div class="draw-offer" style="margin-top:8px;">'+esc(S.msg)+'</div>':'')+
        '<div class="bb-btns"><button id="bbSubmit">Submit</button><button class="secondary" id="bbClear">Clear</button></div>';
    }else{
      map=S.pos;marks=S.marks;
      panel=head+'<div class="draw-offer">'+(S.perfect?(S.done?'Perfect run! Every level cleared.':'Perfect! All '+S.n+' pieces right.'):S.last+' of '+S.n+' right. You lost a life.')+
        ' +'+S.last+' points.<div class="hint" style="margin-top:6px;">Green = right. Red = wrong or missed. The board shows the real position.</div></div>'+
        '<div class="bb-btns"><button id="bbNext">'+(S.next==='over'?'See results':'Next round')+'</button></div>';
    }
    el.innerHTML='<div class="card"><div class="board-wrap">'+boardHtml(map,marks)+'<div class="panel">'+panel+'</div></div></div>';
    wire(el);
  }
  function wire(el){
    var q=function(id){return document.getElementById(id);};
    if(q('bbStart')) q('bbStart').onclick=startRun;
    if(q('bbHide')) q('bbHide').onclick=toRecall;
    if(q('bbClear')) q('bbClear').onclick=function(){S.placed={};S.msg='';draw();};
    if(q('bbSubmit')) q('bbSubmit').onclick=submit;
    if(q('bbNext')) q('bbNext').onclick=function(){if(S.next==='over') endRun(); else nextRound();};
    el.querySelectorAll('[data-p]').forEach(function(b){
      b.onclick=function(){S.sel=(S.sel===b.dataset.p)?null:b.dataset.p;S.msg='';draw();};
    });
    if(S.phase==='recall') el.querySelectorAll('[data-bsq]').forEach(function(c){c.onclick=function(){placeAt(c.dataset.bsq);};});
  }

  // ---------- game flow ----------
  function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
  function tick(){
    var scr=document.getElementById('screen-minigames'),wrap=document.getElementById('bbWrap');
    if(!scr||scr.style.display!=='block'||!wrap||wrap.style.display==='none'){endActive();return;}
    var left=S.secs*1000-(Date.now()-S.t0);
    if(left<=0){toRecall();return;}
    var bar=document.getElementById('bbBarIn'),tx=document.getElementById('bbLeft');
    if(bar) bar.style.width=(left/(S.secs*1000)*100)+'%';
    if(tx) tx.textContent=(left/1000).toFixed(1)+'s';
  }
  function startRun(){
    S.rid++;S.level=1;S.lives=LIVES;S.score=0;S.seen={};S.done=false;S.newBest=false;nextRound();
  }
  function nextRound(){
    S.rl=S.level;S.n=nPieces(S.level);S.secs=secsFor(S.level);
    var pos,tries=0;
    do{pos=gen(S.n);tries++;}while(S.seen[keyOf(pos)]&&tries<20);   // never the same position twice in a run
    S.seen[keyOf(pos)]=1;S.pos=pos;S.placed={};S.sel=null;S.msg='';S.marks=null;
    S.phase='show';S.t0=Date.now();stopTimer();S.timer=setInterval(tick,100);draw();
  }
  function toRecall(){stopTimer();S.phase='recall';S.placed={};S.sel=null;S.msg='';draw();}
  function placeAt(sq){
    var cur=S.placed[sq];
    if(!S.sel){
      if(cur){delete S.placed[sq];S.msg='';playMoveSound();}
      else S.msg='Pick a piece from the list first.';
      draw();return;
    }
    if(cur===S.sel) delete S.placed[sq];
    else{
      if(!cur&&Object.keys(S.placed).length>=S.n){S.msg='You can only place '+S.n+' pieces. Remove one first.';draw();return;}
      S.placed[sq]=S.sel;
    }
    S.msg='';playMoveSound();draw();
  }
  function submit(){
    var correct=0,marks={};
    Object.keys(S.pos).forEach(function(k){
      if(S.placed[k]===S.pos[k]){correct++;marks[k]='ok';}else marks[k]='bad';
    });
    Object.keys(S.placed).forEach(function(k){if(S.pos[k]!==S.placed[k]) marks[k]='bad';});
    S.marks=marks;S.last=correct;S.score+=correct;S.perfect=(correct===S.n);
    if(S.perfect){
      playWinSound();
      if(S.level>=MAXL){S.next='over';S.done=true;}else{S.level++;S.next='round';}
    }else{
      playLossSound();S.lives--;S.next=S.lives<=0?'over':'round';
    }
    S.phase='result';draw();
  }
  function endRun(){
    stopTimer();S.phase='over';draw();
    saveRun().then(function(){draw();loadBoard();});
  }
  // leaving the page or the tab in the middle of a run still saves your score
  function endActive(){
    if(S.phase==='show'||S.phase==='recall'||S.phase==='result'){
      stopTimer();S.phase='idle';saveRun().then(function(){loadBoard();});
    }else stopTimer();
  }

  // ---------- saving + leaderboard ----------
  async function saveRun(){
    if(!ME||S.score<1) return false;
    var run={score:S.score,level:Math.min(MAXL,S.rl)},rid=S.rid;
    try{
      if(!S.bestLoaded) await loadBoard();
      if(S.best&&!(run.score>S.best.score||(run.score===S.best.score&&run.level>S.best.level))) return false;
      await db.ref('hb/bbLeaderboard/'+ME.username).set(run);
      S.best=run;if(rid===S.rid) S.newBest=true;
      return true;
    }catch(e){console.error('blindfold save failed',e);return false;}
  }
  async function loadBoard(){
    var box=document.getElementById('bbBoard');
    var html;
    try{
      var snap=await db.ref('hb/bbLeaderboard').once('value'),users=snap.exists()?snap.val():{};
      var rows=Object.keys(users).map(function(u){return {u:u,score:users[u].score,level:users[u].level};})
        .filter(function(x){return typeof x.score==='number'&&typeof x.level==='number';});
      var mine=rows.filter(function(x){return ME&&x.u===ME.username;})[0];
      if(mine) S.best={score:mine.score,level:mine.level};
      S.bestLoaded=true;
      rows.sort(function(a,b){return (b.score-a.score)||(b.level-a.level);});
      rows=rows.slice(0,10);
      html=rows.length?rows.map(function(x,i){
        return '<div class="seat"><span class="who">#'+(i+1)+' <span class="user-link" data-user="'+esc(x.u)+'">'+esc(x.u)+'</span>'+(ME&&x.u===ME.username?' (you)':'')+
               '</span><span class="taken">'+x.score+' pts &middot; level '+x.level+'</span></div>';
      }).join(''):'<p class="desc">No runs yet. Be the first!</p>';
    }catch(e){
      console.error(e);
      html='<p class="desc">Could not load the leaderboard (publish the new Firebase rule).</p>';
    }
    box=document.getElementById('bbBoard');
    if(box) box.innerHTML='<div class="card"><h2>Top memories</h2><p class="desc">Most pieces placed correctly in one run, then the highest level.</p>'+html+'</div>';
    if(document.getElementById('bbGame')&&(S.phase==='idle'||S.phase==='over')) draw();
  }

  // ---------- Minigames page: Knight's tour | Blindfold board ----------
  var prevMG=window.renderMinigames;
  window.renderMinigames=function(){
    endActive();S.phase='idle';
    prevMG();
    var scr=document.getElementById('screen-minigames');
    if(!scr) return;
    var tabs=document.createElement('div');
    tabs.className='an-tabs';
    tabs.innerHTML='<button class="an-tabbtn active" data-mg="kt">Knight\'s tour</button><button class="an-tabbtn" data-mg="bb">Blindfold board</button>';
    scr.insertBefore(tabs,scr.firstChild);
    var wrap=document.createElement('div');
    wrap.id='bbWrap';wrap.style.display='none';
    wrap.innerHTML='<div id="bbGame"></div><div id="bbBoard"></div>';
    scr.appendChild(wrap);
    function setTab(t){
      var kg=document.getElementById('ktGame'),kb=document.getElementById('ktBoard');
      if(kg) kg.style.display=(t==='kt')?'':'none';
      if(kb) kb.style.display=(t==='kt')?'':'none';
      wrap.style.display=(t==='bb')?'block':'none';
      tabs.querySelectorAll('[data-mg]').forEach(function(b){b.classList.toggle('active',b.dataset.mg===t);});
      if(t==='bb'){S.phase='idle';draw();loadBoard();}
      else endActive();
    }
    tabs.querySelectorAll('[data-mg]').forEach(function(b){b.onclick=function(){setTab(b.dataset.mg);};});
  };
  var psh=window.showScreen;
  window.showScreen=function(n){
    if(n!=='minigames') endActive();
    return psh(n);
  };

  // ---------- best score on profiles ----------
  var po=window.openProfile;
  window.openProfile=async function(name){
    var r=await po.apply(this,arguments);
    try{
      var scr=document.getElementById('screen-profile'),nm=scr.querySelector('.pf-name');
      if(nm&&nm.textContent.indexOf(name)===0&&!scr.querySelector('[data-bb]')){
        var v=(await db.ref('hb/bbLeaderboard/'+name).once('value')).val();
        if(scr.querySelector('[data-bb]')||nm.textContent.indexOf(name)!==0) return r;
        var d=document.createElement('div');d.className='card';d.dataset.bb='1';
        d.innerHTML='<h2>Blindfold board best</h2><p class="desc" style="margin:0;">'+((v&&typeof v.score==='number')?v.score+' points, level '+v.level:'No runs yet')+'</p>';
        scr.appendChild(d);
      }
    }catch(e){console.error(e);}
    return r;
  };
})();
</script>

<style>
