<script>
(function(){
  // ---------- settings storage (this device only) ----------
  var KEY = 'pawniac-settings';
  var DEFAULTS = {
    sound:true,
    sMove:true, sCapture:true, sCheck:true, sRandomize:true, sTick:true, sStart:true, sWin:true, sLoss:true, sDraw:true,
    coords:true, dots:true, lastMove:true,
    autoQueen:false, confirmDraw:false, autoDecline:false,
    tabFlash:true
  };
  var S = Object.assign({}, DEFAULTS);
  try{ var raw = localStorage.getItem(KEY); if(raw) Object.assign(S, JSON.parse(raw)); }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  function applyClasses(){
    var c = document.body.classList;
    c.toggle('no-coords', !S.coords);
    c.toggle('no-dots', !S.dots);
    c.toggle('no-last', !S.lastMove);
  }
  applyClasses();

  // ---------- sounds: gate every existing sound function ----------
  var SOUND_FN = {
    playMoveSound:'sMove', playCaptureSound:'sCapture', playCheckSound:'sCheck', playRandomizeSound:'sRandomize',
    playLowTimeTick:'sTick', playGameStartSound:'sStart', playWinSound:'sWin', playLossSound:'sLoss', playDrawSound:'sDraw'
  };
  var ORIG = {};
  Object.keys(SOUND_FN).forEach(function(name){
    var orig = window[name];
    ORIG[name] = orig;
    window[name] = function(){
      if(S.sound && S[SOUND_FN[name]]) return orig.apply(this, arguments);
    };
  });

  // ---------- the Settings screen + nav tab ----------
  var screen = document.createElement('div');
  screen.id = 'screen-settings';
  screen.style.display = 'none';
  document.querySelector('.wrap').appendChild(screen);

  // ---------- username menu: click your name -> "My profile" / "Settings" ----------
  function openSettings(){
    var inGame = document.getElementById('screen-game').style.display === 'block' && gameState && gameState.status === 'active';
    if(inGame && !confirm('Your clock keeps running while you are away. Leave the game view?')) return;
    stopPoll();
    renderSettings();
  }
  function closeUserMenu(){ var m = document.getElementById('userMenu'); if(m) m.style.display = 'none'; }

  var prevUserbox = window.renderUserbox;
  window.renderUserbox = function(p){
    prevUserbox(p);
    var box = document.getElementById('userbox');
    var n = box.querySelector('.name');
    if(!n) return;
    n.classList.remove('user-link');       // step 5 made the name open the profile directly; the menu replaces that
    delete n.dataset.user;
    n.classList.add('menu-trigger');
    n.innerHTML = ME.username + ' <span class="caret">&#9662;</span>';
    var menu = document.createElement('div');
    menu.id = 'userMenu';
    menu.className = 'user-menu';
    menu.innerHTML = '<div class="um-item" data-go="profile">My profile</div><div class="um-item" data-go="settings">Settings</div>';
    box.appendChild(menu);
    n.onclick = function(e){
      e.stopPropagation();
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    };
    menu.querySelectorAll('.um-item').forEach(function(it){
      it.onclick = function(e){
        e.stopPropagation();
        closeUserMenu();
        if(it.dataset.go === 'profile') openProfile(ME.username);
        else openSettings();
      };
    });
  };
  document.addEventListener('click', function(e){ if(!e.target.closest('#userbox')) closeUserMenu(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeUserMenu(); });

  var prevShow = window.showScreen;
  window.showScreen = function(n){
    prevShow(n);
    screen.style.display = (n === 'settings') ? 'block' : 'none';
    closeUserMenu();
  };

  function row(key, label, hint, preview, extraCls){
    return '<div class="set-row' + (extraCls ? ' ' + extraCls : '') + '"><div><div class="set-label">' + label + '</div>' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div><div class="set-ctl">' +
      (preview ? '<button class="secondary set-play" data-play="' + preview + '" title="Preview">&#9654;</button>' : '') +
      '<label class="switch"><input type="checkbox" data-set="' + key + '"' + (S[key] ? ' checked' : '') + '><span></span></label></div></div>';
  }

  function renderSettings(){
    showScreen('settings');
    var dim = S.sound ? '' : 'set-dim';
    screen.innerHTML =
      '<div class="card"><h2>Sound</h2>' +
        '<p class="desc">Saved on this device.</p>' +
        row('sound', 'All sounds', 'Master switch') +
        row('sMove', 'Move', '', 'playMoveSound', dim) +
        row('sCapture', 'Capture', '', 'playCaptureSound', dim) +
        row('sCheck', 'Check', '', 'playCheckSound', dim) +
        row('sRandomize', 'Randomize piece', 'The roll in random-button mode', 'playRandomizeSound', dim) +
        row('sStart', 'Game start', '', 'playGameStartSound', dim) +
        row('sTick', 'Low-time ticking', 'Ticks each second when your clock is low', 'playLowTimeTick', dim) +
        row('sWin', 'You win', '', 'playWinSound', dim) +
        row('sLoss', 'You lose', '', 'playLossSound', dim) +
        row('sDraw', 'Draw', '', 'playDrawSound', dim) +
      '</div>' +
      '<div class="card"><h2>Board</h2>' +
        row('coords', 'Show coordinates', 'Rank and file letters on the squares') +
        row('dots', 'Show legal-move dots', 'Dots and rings on squares you can move to') +
        row('lastMove', 'Highlight last move', '') +
      '</div>' +
      '<div class="card"><h2>Gameplay</h2>' +
        row('autoQueen', 'Always promote to Queen', 'Skips the promotion picker') +
        row('confirmDraw', 'Confirm before offering a draw', 'Asks "Offer a draw?" first') +
        row('autoDecline', 'Auto-decline draw offers', 'Offers from your opponent are declined straight away') +
      '</div>' +
      '<div class="card"><h2>Notifications</h2>' +
        row('tabFlash', 'Flash the tab title on your turn', 'Only while you are on another tab or window') +
      '</div>' +
      '<div class="card"><button class="secondary" id="setReset">Reset to defaults</button></div>';

    screen.querySelectorAll('[data-set]').forEach(function(cb){
      cb.onchange = function(){
        S[cb.dataset.set] = cb.checked;
        save(); applyClasses();
        if(cb.dataset.set === 'sound') renderSettings();   // dims / un-dims the individual sounds
      };
    });
    screen.querySelectorAll('[data-play]').forEach(function(b){
      b.onclick = function(){ var f = ORIG[b.dataset.play]; if(f) f(); };   // preview ignores the toggles
    });
    document.getElementById('setReset').onclick = function(){
      S = Object.assign({}, DEFAULTS); save(); applyClasses(); renderSettings();
    };
  }
  window.renderSettings = renderSettings;

  // ---------- flash the tab title when it is your turn ----------
  var BASE_TITLE = document.title || 'Pawniac';
  var flash = {timer:null, key:null};
  function stopFlash(){
    if(flash.timer){ clearInterval(flash.timer); flash.timer = null; }
    document.title = BASE_TITLE;
  }
  function startFlash(msg){
    if(flash.timer) return;
    var alt = false;
    document.title = '\u265F ' + msg;
    flash.timer = setInterval(function(){
      alt = !alt;
      document.title = alt ? BASE_TITLE : '\u265F ' + msg;
    }, 1000);
  }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) stopFlash(); });
  window.addEventListener('focus', stopFlash);

  function checkTurnFlash(g){
    if(!S.tabFlash || !g || g.status !== 'active'){ if(g && g.status !== 'active') stopFlash(); return; }
    var me = myRole(g); if(!me) return;
    var needs = g.turn === me.side &&
      (g.mode === 'team' ? (me.role === 'brain' ? !g.announced : !!g.announced) : true);
    var key = currentGameId + ':' + (g.moveLog || []).length + ':' + (g.announced || '');
    if(needs){
      if(key !== flash.key){
        flash.key = key;
        if(document.hidden || !document.hasFocus()){
          startFlash(g.mode === 'team' ? (me.role === 'brain' ? 'Call a piece!' : 'Move your piece!') : 'Your move!');
        }
      }
    } else {
      flash.key = null;
    }
  }

  // ---------- hook into the game screen ----------
  var declBusy = false;
  var prevDraw = window.drawGame;
  window.drawGame = function(){
    // Always-queen: resolve the promotion before the picker is ever drawn
    if(S.autoQueen && pendingPromotion){
      var pp = pendingPromotion;
      pendingPromotion = null;
      selectedSquare = null;
      makeMove(pp.from, pp.to, 'q');
    }
    prevDraw();
    var g = gameState; if(!g) return;
    var me = myRole(g);
    if(g.status === 'active' && me){
      if(S.autoDecline && g.drawOffer && g.drawOffer !== me.side){
        var acc = document.getElementById('btnAcceptDraw');
        if(acc){ var box = acc.closest('.draw-offer'); if(box) box.remove(); }
        if(!declBusy){
          declBusy = true;
          Promise.resolve(declineDraw()).then(function(){ setTimeout(function(){ declBusy = false; }, 500); });
        }
      } else if(S.confirmDraw){
        var ob = document.getElementById('btnOfferDraw');
        if(ob) ob.onclick = function(){ if(confirm('Offer a draw?')) offerDraw(me.side); };
      }
    }
    checkTurnFlash(g);
  };
})();

<script>
(function(){
  var MAX_GIF_BYTES = 140 * 1024;     // GIFs are stored as-is, so they have to be small
  var MAX_CHARS     = 190000;         // must stay under the 200000 limit in the Firebase rule
  var DATA_RE = /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/;

  function validUrl(u){ return typeof u === 'string' && u.length < 200000 && DATA_RE.test(u); }

  function setImg(av, url){
    av.innerHTML = '';
    var im = new Image();
    im.alt = '';
    im.draggable = false;
    im.src = url;
    av.appendChild(im);
  }
  function setLetter(av, name){
    av.textContent = name.charAt(0).toUpperCase();
  }

  // static images: crop to a centered square, shrink to 256x256, save as webp (or jpeg as fallback)
  function toSquareDataUrl(file){
    return new Promise(function(resolve, reject){
      var objUrl = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function(){
        URL.revokeObjectURL(objUrl);
        var S = 256, c = document.createElement('canvas');
        c.width = c.height = S;
        var ctx = c.getContext('2d');
        var side = Math.min(im.width, im.height);
        ctx.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, S, S);
        var out = c.toDataURL('image/webp', 0.85);
        if(out.indexOf('data:image/webp') !== 0){
          ctx.globalCompositeOperation = 'destination-over';
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, S, S);
          out = c.toDataURL('image/jpeg', 0.85);
        }
        resolve(out);
      };
      im.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error("Couldn't read that image.")); };
      im.src = objUrl;
    });
  }
  function readAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = function(){ reject(new Error("Couldn't read that file.")); };
      r.readAsDataURL(file);
    });
  }

  async function prepare(file){
    if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error('Use a PNG, JPG, WebP or GIF.');
    var url;
    if(file.type === 'image/gif'){
      if(file.size > MAX_GIF_BYTES) throw new Error('That GIF is too big (max ' + Math.round(MAX_GIF_BYTES / 1024) + ' KB).');
      url = await readAsDataUrl(file);
    } else {
      url = await toSquareDataUrl(file);
    }
    if(!validUrl(url) || url.length > MAX_CHARS) throw new Error('That picture is too big. Try a smaller one.');
    return url;
  }

  function stillOnProfile(name){
    var scr = document.getElementById('screen-profile');
    var n = scr && scr.querySelector('.pf-name');
    return !!(scr && scr.style.display === 'block' && n && n.textContent.indexOf(name) === 0);
  }

  async function decorate(name){
    var scr = document.getElementById('screen-profile');
    var av = scr && scr.querySelector('.pf-avatar');
    if(!av || !stillOnProfile(name)) return;

    var url = null;
    try{
      var snap = await db.ref('hb/avatar/' + name).once('value');
      url = snap.exists() ? snap.val() : null;
    }catch(e){ console.error('avatar load failed', e); }
    if(!stillOnProfile(name)) return;
    if(validUrl(url)) setImg(av, url);

    if(name !== ME.username) return;

    // ---- own profile: picture controls ----
    av.classList.add('editable');
    var info = av.parentNode.querySelector('div:last-child');
    var ctl = document.createElement('div');
    ctl.className = 'pf-ctl';
    ctl.innerHTML =
      '<button class="secondary" id="avPick">Change picture</button>' +
      '<button class="secondary danger" id="avDel" style="display:' + (validUrl(url) ? 'inline-block' : 'none') + ';">Remove</button>' +
      '<span class="hint" id="avMsg">PNG, JPG, WebP or GIF (GIFs up to ' + Math.round(MAX_GIF_BYTES / 1024) + ' KB)</span>' +
      '<input type="file" id="avFile" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">';
    info.appendChild(ctl);

    var msg = document.getElementById('avMsg');
    var file = document.getElementById('avFile');
    var del = document.getElementById('avDel');
    var pickNow = function(){ file.click(); };
    document.getElementById('avPick').onclick = pickNow;
    av.onclick = pickNow;

    file.onchange = async function(){
      var f = file.files && file.files[0];
      file.value = '';
      if(!f) return;
      msg.textContent = 'Saving...';
      try{
        var data = await prepare(f);
        await db.ref('hb/avatar/' + ME.username).set(data);
        setImg(av, data);
        del.style.display = 'inline-block';
        msg.textContent = 'Saved';
      }catch(e){
        console.error(e);
        msg.textContent = (e && e.code === 'PERMISSION_DENIED')
          ? "Couldn't save (publish the new Firebase rules)."
          : (e && e.message) || "Couldn't save.";
      }
    };
    del.onclick = async function(){
      msg.textContent = 'Removing...';
      try{
        await db.ref('hb/avatar/' + ME.username).remove();
        setLetter(av, ME.username);
        del.style.display = 'none';
        msg.textContent = 'Removed';
      }catch(e){
        console.error(e);
        msg.textContent = "Couldn't remove.";
      }
    };
  }

<script>
(function(){
  var NAME_RE = /^[A-Za-z0-9_]{3,20}$/;
  var CODES = ('AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ ' +
    'CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR ' +
    'GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP ' +
    'KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ ' +
    'NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW ' +
    'SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ ' +
    'UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS XK YE YT ZA ZM ZW').split(' ');

  var dn = null;
  try{ dn = new Intl.DisplayNames(['en'], {type:'region'}); }catch(e){}
  function cname(code){
    if(code === 'XK') return 'Kosovo';
    try{ return (dn && dn.of(code)) || code; }catch(e){ return code; }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function flagHtml(code){
    if(!/^[A-Z]{2}$/.test(code || '')) return '';
    return '<img class="flag" src="https://flagcdn.com/w20/' + code.toLowerCase() + '.png" alt="' + code +
           '" title="' + esc(cname(code)) + '" onerror="this.style.display=\'none\'">';
  }

  // ---------- country cache ----------
  var COUNTRY = {}, pending = {};
  function nameHtml(n){
    if(!n) return '';
    var nm = NAME_RE.test(n) ? '<span class="user-link" data-user="' + n + '">' + n + '</span>' : esc(n);
    return flagHtml(COUNTRY[n]) + nm;
  }
  function fetchCountries(names, done){
    names.forEach(function(n){
      if(!n || COUNTRY[n] !== undefined || pending[n] || !NAME_RE.test(n)) return;
      pending[n] = true;
      db.ref('hb/country/' + n).once('value').then(function(s){
        COUNTRY[n] = s.exists() ? s.val() : '';
      }).catch(function(){
        COUNTRY[n] = '';
      }).then(function(){
        delete pending[n];
        done();
      });
    });
  }

  // ---------- player info on the board ----------
  function infoHtml(g, color){
    var s = g.seats || {};
    var dot = '<span class="pi-dot ' + color + '"></span>';
    if(g.mode === 'team'){
      var pair = color === 'w' ? [[s.whiteBrain, 'Brain'], [s.whiteHand, 'Hand']] : [[s.blackBrain, 'Brain'], [s.blackHand, 'Hand']];
      return dot + pair.filter(function(p){ return p[0]; }).map(function(p){
        return nameHtml(p[0]) + '<span class="pi-role">' + p[1] + '</span>';
      }).join('<span class="pi-sep">&middot;</span>');
    }
    var n = color === 'w' ? s.white : s.black;
    var r = g.ratingSnapshot ? (color === 'w' ? g.ratingSnapshot.white : g.ratingSnapshot.black) : null;
    return dot + nameHtml(n) + (typeof r === 'number' ? ' <span class="pi-rating">(' + r + ')</span>' : '');
  }

  function seatNames(g){
    return Object.keys(g.seats || {}).map(function(k){ return g.seats[k]; }).filter(Boolean);
  }

  function decorateBars(){
    var g = gameState; if(!g) return;
    var scr = document.getElementById('screen-game');
    var boardEl = scr && scr.querySelector('.board');
    if(!boardEl) return;
    scr.querySelectorAll('.pbar').forEach(function(b){ b.remove(); });

    var top = flipped ? 'w' : 'b', bot = flipped ? 'b' : 'w';
    var clocks = scr.querySelectorAll('.clock');
    [[top, 0], [bot, 1]].forEach(function(t){
      var html = infoHtml(g, t[0]);
      if(clocks.length === 2){
        var lab = clocks[t[1]].querySelector('.label');
        if(lab){ lab.className = 'label pi'; lab.innerHTML = html; }
      } else {
        var bar = document.createElement('div');
        bar.className = 'pbar';
        bar.innerHTML = html;
        boardEl.parentNode.insertBefore(bar, t[1] === 0 ? boardEl : boardEl.nextSibling);
      }
    });
    fetchCountries(seatNames(g), function(){
      if(gameState === g || gameState) decorateBars();
    });
  }

  var prevDraw = window.drawGame;
  window.drawGame = function(){
    try{ prevDraw(); }
    finally{   // even if an earlier block throws, the player bars still get drawn
      try{ decorateBars(); }catch(e){ console.error('player bars failed', e); }
    }
  };
  // safety net: if the board was redrawn by something else and the bars are missing, put them back
  setInterval(function(){
    try{
      var scr = document.getElementById('screen-game');
      if(gameState && scr && scr.style.display === 'block' && scr.querySelector('.board') &&
         !scr.querySelector('.label.pi') && !scr.querySelector('.pbar')) decorateBars();
    }catch(e){ console.error('player bars failed', e); }
  }, 1000);

  // ---------- country on profiles ----------
  function stillOnProfile(name){
    var scr = document.getElementById('screen-profile');
    var n = scr && scr.querySelector('.pf-name');
    return !!(scr && scr.style.display === 'block' && n && n.textContent.indexOf(name) === 0);
  }

  async function decorateProfile(name){
    if(!stillOnProfile(name)) return;
    var scr = document.getElementById('screen-profile');
    var nameEl = scr.querySelector('.pf-name');
    var code = '';
    try{
      var snap = await db.ref('hb/country/' + name).once('value');
      code = snap.exists() ? snap.val() : '';
    }catch(e){ console.error('country load failed', e); }
    if(!stillOnProfile(name)) return;
    COUNTRY[name] = code;

    var row = document.createElement('div');
    row.className = 'pf-country';
    if(name !== ME.username){
      if(!/^[A-Z]{2}$/.test(code)) return;
      row.innerHTML = flagHtml(code) + '<span>' + esc(cname(code)) + '</span>';
      nameEl.after(row);
      return;
    }
    var opts = CODES.map(function(c){ return {c:c, n:cname(c)}; })
      .sort(function(a, b){ return a.n.localeCompare(b.n); })
      .map(function(o){ return '<option value="' + o.c + '"' + (o.c === code ? ' selected' : '') + '>' + esc(o.n) + '</option>'; })
      .join('');
    row.innerHTML = '<span id="pfFlag">' + flagHtml(code) + '</span>' +
      '<select id="pfCountry" aria-label="Country"><option value=""' + (code ? '' : ' selected') + '>Country: not set</option>' + opts + '</select>' +
      '<span class="hint" id="pfCountryMsg"></span>';
    nameEl.after(row);

    document.getElementById('pfCountry').onchange = async function(){
      var v = this.value, msg = document.getElementById('pfCountryMsg');
      msg.textContent = 'Saving...';
      try{
        if(v) await db.ref('hb/country/' + ME.username).set(v);
        else await db.ref('hb/country/' + ME.username).remove();
        COUNTRY[ME.username] = v;
        document.getElementById('pfFlag').innerHTML = flagHtml(v);
        msg.textContent = 'Saved';
      }catch(e){
        console.error(e);
        msg.textContent = (e && e.code === 'PERMISSION_DENIED') ? "Couldn't save (publish the new Firebase rules)." : "Couldn't save.";
      }
    };
  }

  var prevOpen = window.openProfile;
  window.openProfile = async function(name){
    await prevOpen(name);
    try{ await decorateProfile(name); }catch(e){ console.error(e); }
  };
})();
</script>

<script>
(function(){
  var KEY = 'pawniac-pieces-v1';
  var store = {}, uri = {}, keep = [];
  try{ store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ store = {}; }

  var origUrl = window.pieceImgUrl;
  function dataUri(k){
    if(!uri[k]) uri[k] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(store[k]);
    return uri[k];
  }
  // Pieces we have saved on this device come from memory (instant, no network).
  // Anything not saved yet still uses the normal Wikimedia link.
  window.pieceImgUrl = function(color, type){
    var k = color + type;
    return store[k] ? dataUri(k) : origUrl(color, type);
  };

  ['w','b'].forEach(function(c){
    ['p','n','b','r','q','k'].forEach(function(t){
      var k = c + t;
      var im = new Image();                       // warm the browser cache + keep the picture decoded
      im.src = window.pieceImgUrl(c, t);
      keep.push(im);
      if(store[k]) return;
      // try to save a copy on this device for next time (silently skipped if the browser blocks it)
      fetch(origUrl(c, t)).then(function(r){
        if(!r.ok) throw new Error('bad status');
        return r.text();
      }).then(function(txt){
        if(!/^\s*(<\?xml|<svg)/i.test(txt) || txt.length > 30000 || /<script|javascript:|\son\w+\s*=/i.test(txt)) throw new Error('unexpected file');
        store[k] = txt;
        try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
      }).catch(function(){});
    });
  });
})();
</script>

<!-- ---------- part B: live stats (players online / games in progress / searching) ---------- -->
<script>
(function(){
  var onlineRef = null, playingRef = null, playingGid = null, connRef = null, connCb = null;
  var liveRef = null, liveCb = null, qRef = null, qCb = null;

  // ----- tell the server we're here (removed automatically when the tab closes) -----
  function announce(){
    if(onlineRef){
      var r = onlineRef;
      r.onDisconnect().remove().then(function(){ if(onlineRef === r) r.set(true); }).catch(function(){});
    }
    if(playingRef){
      var p = playingRef, gid = playingGid;
      p.onDisconnect().remove().then(function(){ if(playingRef === p) p.set(gid); }).catch(function(){});
    }
  }
  function goOnline(){
    if(!ME || onlineRef) return;
    onlineRef = db.ref('hb/live/online/' + ME.username);
    connRef = db.ref('.info/connected');
    connCb = connRef.on('value', function(s){ if(s.val() === true) announce(); });
  }
  function setPlaying(gid){
    if(gid === playingGid) return;
    if(playingRef){
      try{ playingRef.onDisconnect().cancel(); }catch(e){}
      playingRef.remove().catch(function(){});
    }
    playingGid = gid;
    playingRef = gid ? db.ref('hb/live/playing/' + ME.username) : null;
    if(playingRef) announce();
  }
  function goOffline(){
    try{ if(connRef) connRef.off('value', connCb); }catch(e){}
    connRef = null; connCb = null;
    setPlaying(null);
    if(onlineRef){
      try{ onlineRef.onDisconnect().cancel(); }catch(e){}
      onlineRef.remove().catch(function(){});
      onlineRef = null;
    }
  }

  var beat = 0;
  setInterval(function(){
    try{
      if(!ME){ return; }
      goOnline();
      var g = gameState;
      var onGame = document.getElementById('screen-game').style.display === 'block';
      var want = (g && onGame && g.status === 'active' && currentGameId && myRole(g)) ? currentGameId : null;
      setPlaying(want);
      // every ~30s, put the flags back (covers a second tab of yours closing and clearing them)
      if(++beat % 15 === 0){
        if(onlineRef) onlineRef.set(true).catch(function(){});
        if(playingRef) playingRef.set(playingGid).catch(function(){});
      }
    }catch(e){ console.error('live presence failed', e); }
  }, 2000);

  var prevLogout = window.logout;
  window.logout = async function(){ goOffline(); return prevLogout(); };

  // ----- the sidebar -----
  function detachLive(){
    try{ if(liveRef) liveRef.off('value', liveCb); }catch(e){}
    try{ if(qRef) qRef.off('value', qCb); }catch(e){}
    liveRef = null; qRef = null;
  }
  function attachLive(){
    detachLive();
    var d = {online:null, playing:null, search:null};
    function show(n){ return n === null ? '-' : (n < 0 ? '?' : n); }
    function plural(n, one, many){ return n === 1 ? one : many; }
    function paint(){
      var a = document.getElementById('liveOnline'), b = document.getElementById('livePlaying'), c = document.getElementById('liveSearch');
      if(!a) return;
      a.textContent = show(d.online);
      b.textContent = show(d.playing);
      c.textContent = show(d.search);
      document.getElementById('liveOnlineLbl').textContent = plural(d.online, 'player online', 'players online');
      document.getElementById('livePlayingLbl').textContent = plural(d.playing, 'game in progress', 'games in progress');
      document.getElementById('liveSearchLbl').textContent = plural(d.search, 'player looking for a match', 'players looking for a match');
      var bad = d.online < 0 || d.playing < 0;
      document.getElementById('liveHint').textContent = bad
        ? "Live stats need the new Firebase rule (see the setup note)."
        : 'Updates live. Counts people with Pawniac open.';
    }
    liveRef = db.ref('hb/live');
    liveCb = liveRef.on('value', function(s){
      var v = s.exists() ? s.val() : {};
      d.online = Object.keys(v.online || {}).length;
      var gids = {};
      Object.keys(v.playing || {}).forEach(function(u){ gids[v.playing[u]] = 1; });
      d.playing = Object.keys(gids).length;
      paint();
    }, function(){ d.online = -1; d.playing = -1; paint(); });
    qRef = db.ref('hb/queue/random');
    qCb = qRef.on('value', function(s){
      var v = s.exists() ? s.val() : {}, now = serverNow();
      d.search = Object.keys(v).filter(function(u){ return v[u] && !v[u].gameId && (now - v[u].joinedAt) < 60000; }).length;
      paint();
    }, function(){ d.search = -1; paint(); });
  }

  function addSidebar(){
    var el = document.getElementById('screen-lobby');
    if(!el || el.querySelector('.lobby-cols')) return;
    var left = document.createElement('div');
    left.className = 'lobby-left';
    while(el.firstChild) left.appendChild(el.firstChild);      // moves the existing lobby (buttons keep working)
    var side = document.createElement('aside');
    side.className = 'lobby-right';
    side.innerHTML =
      '<div class="card"><h2>Live now</h2>' +
        '<div class="live-row"><span class="live-dot"></span><b id="liveOnline">-</b><span id="liveOnlineLbl">players online</span></div>' +
        '<div class="live-row"><span class="live-ico">&#9822;</span><b id="livePlaying">-</b><span id="livePlayingLbl">games in progress</span></div>' +
        '<div class="live-row"><span class="live-ico">&#8987;</span><b id="liveSearch">-</b><span id="liveSearchLbl">players looking for a match</span></div>' +
        '<div class="hint" id="liveHint" style="margin-top:8px;"></div>' +
      '</div>';
    var cols = document.createElement('div');
    cols.className = 'lobby-cols';
    cols.appendChild(left);
    cols.appendChild(side);
    el.appendChild(cols);
    attachLive();
  }

  var prevLobby = window.renderLobby;
  window.renderLobby = function(){
    prevLobby();
    try{ addSidebar(); }catch(e){ console.error('live sidebar failed', e); }
  };
  var prevShow = window.showScreen;
  window.showScreen = function(n){
    if(n !== 'lobby') detachLive();
    prevShow(n);
  };
})();
</script>

<script>

  var BEAT_MS  = 15000;    // ping every 15s while searching
  var qm = '1v1';          // lobby switch: '1v1' or '2v2'
  var TS = null;           // the active 2v2 search

  function isHB(){ return !document.querySelector('#screen-lobby [data-variant="standard"].active'); }
  function wantTeam(){ return qm === '2v2' && isHB(); }
  function setHint(html){ var h = document.getElementById('quickHint'); if(h) h.innerHTML = html; }

  // ---------- 1. searching ----------
  function stopTeamSearch(){
    if(!TS) return;
    var t = TS; TS = null;
    clearInterval(t.beat);
    try{ if(t.qCb) t.qRef.off('value', t.qCb); }catch(e){}
    try{ if(t.idCb) t.idRef.off('value', t.idCb); }catch(e){}
    try{ t.meRef.onDisconnect().cancel(); }catch(e){}
    t.meRef.remove().catch(function(){});
  }
  // leaving the lobby (or any screen change that calls stopPoll) cancels the search
  var prevStop = window.stopPoll;
  window.stopPoll = function(){ stopTeamSearch(); return prevStop.apply(this, arguments); };

  function paintSearch(n){
    if(!TS) return;
    setHint('Searching for a 2v2 game... ' + n + '/4 players <span class="backlink" id="btnCancelTeamQ">cancel</span>');
    var c = document.getElementById('btnCancelTeamQ');
    if(c) c.onclick = function(){ stopTeamSearch(); renderLobby(); };
  }

  function fresh(q, tc){
    var now = serverNow();
    return Object.keys(q).filter(function(u){
      var e = q[u];
      return e && e.variant === 'team' && e.tc === tc && !e.gameId &&
             typeof e.joinedAt === 'number' && (now - e.joinedAt) < FRESH_MS;
    }).sort();
  }

  async function teamQuickMatch(){
    stopTeamSearch();
    var btn = document.getElementById('btnQuick');
    if(btn) btn.disabled = true;
    var meRef = db.ref(QUEUE + '/' + ME.username);
    var t = {tc:selectedTC, meRef:meRef, creating:false, beat:null,
             qRef:db.ref(QUEUE), qCb:null, idRef:meRef.child('gameId'), idCb:null};
    TS = t;
    try{
      await meRef.set({joinedAt:serverNow(), gameId:'', tc:t.tc, variant:'team'});
    }catch(e){
      console.error(e);
      if(TS === t) TS = null;
      setHint("Couldn't join the queue (check the Firebase rules).");
      if(btn) btn.disabled = false;
      return;
    }
    if(TS !== t){ meRef.remove().catch(function(){}); return; }   // cancelled while joining
    meRef.onDisconnect().remove();
    t.beat = setInterval(function(){
      if(TS === t) meRef.child('joinedAt').set(serverNow()).catch(function(){});
    }, BEAT_MS);
    // someone else built the game and put us in it
    t.idCb = t.idRef.on('value', function(s){
      var gid = s.val();
      if(!gid || TS !== t) return;
      stopTeamSearch();
      currentGameId = gid;
      enterGameScreen(gid);
    });
    t.qCb = t.qRef.on('value', function(s){
      if(TS === t) onQueue(t, s.exists() ? s.val() : {});
    });
    paintSearch(1);
  }

  function onQueue(t, q){
    var group = fresh(q, t.tc);
    paintSearch(Math.min(Math.max(group.length, 1), 4));
    var four = group.slice(0, 4);
    // only ONE player builds the game: the first of the four by username (no clashes)
    if(four.length === 4 && four[0] === ME.username && !t.creating){
      t.creating = true;
      createTeamGame(t, four).then(function(ok){ if(!ok && TS === t) t.creating = false; });
    }
  }

  async function createTeamGame(t, four){
    try{
      // re-read right before creating: all four must still be waiting
      var snap = await t.qRef.once('value');
      var still = fresh(snap.exists() ? snap.val() : {}, t.tc);
      if(!four.every(function(n){ return still.indexOf(n) >= 0; }) || TS !== t) return false;

      var ratings = {};
      await Promise.all(four.map(async function(n){
        var p = await kget('hb:leaderboard:' + n, true);
        ratings[n] = (p && typeof p.rating === 'number') ? p.rating : 1200;
      }));
      if(TS !== t) return false;

      // balanced teams: strongest + weakest vs the middle two; colors and roles are random
      var by = four.slice().sort(function(a, b){ return ratings[b] - ratings[a]; });
      var A = [by[0], by[3]], B = [by[1], by[2]];
      var white = Math.random() < 0.5 ? A : B;
      var black = (white === A) ? B : A;
      if(Math.random() < 0.5) white = [white[1], white[0]];
      if(Math.random() < 0.5) black = [black[1], black[0]];
      var avg = function(p){ return Math.round((ratings[p[0]] + ratings[p[1]]) / 2); };

      var code = genCode();
      var game = {
        mode:'team', status:'active', fen:new Chess().fen(), turn:'w', announced:null,
        moveLog:[], winner:null, drawOffer:'', clock:freshClock(t.tc),
        seats:{whiteBrain:white[0], whiteHand:white[1], blackBrain:black[0], blackHand:black[1]},
        ratingSnapshot:{white:avg(white), black:avg(black)},   // team averages
        teamRatings:ratings
      };
      var saved = await kset('hb:game:' + code, game, true);
      if(!saved){
        stopTeamSearch();
        setHint("Couldn't start the 2v2 game (check the Firebase rules).");
        var b = document.getElementById('btnQuick'); if(b) b.disabled = false;
        return false;
      }
      if(TS !== t) return false;
      await Promise.all(four.filter(function(n){ return n !== ME.username; }).map(function(n){
        return db.ref(QUEUE + '/' + n + '/gameId').set(code);
      }));
      stopTeamSearch();
      currentGameId = code;
      enterGameScreen(code);
      return true;
    }catch(e){
      console.error('2v2 match failed', e);
      return false;
    }
  }

  // ---------- 2. rating for team games (same Hand & Brain rating as 1v1) ----------
  // Each side's rating = average of its two players. Both teammates get the same change.
  var prevSettle = window.settleMyRating;
  window.settleMyRating = async function(g){
    if(!g || g.mode !== 'team' || !g.ratingSnapshot) return prevSettle(g);
    if(g.status !== 'finished' || g.winner === 'abort') return;
    var gid = currentGameId, me = myRole(g);
    if(!me) return;
    if(myRatingChangeCache[gid] || settlingGames[gid]) return;
    if(g.ratingApplied && g.ratingApplied[ME.username]) return;
    settlingGames[gid] = true;
    var side = me.side;
    var myStart  = side === 'w' ? g.ratingSnapshot.white : g.ratingSnapshot.black;
    var oppStart = side === 'w' ? g.ratingSnapshot.black : g.ratingSnapshot.white;
    var change = computeEloChange(myStart, oppStart, scoreForSide(g.winner, side));
    var path = 'hb:leaderboard:' + ME.username;
    var prof = (await kget(path, true)) || {rating:1200, games:0};
    var newRating = prof.rating + change;
    myRatingChangeCache[gid] = {change:change, newRating:newRating};
    await kset(path, {rating:newRating, games:prof.games + 1}, true);
    await db.ref(dbPath('hb:game:' + gid + '/ratingApplied/' + ME.username)).set(true);
    if(gameState && currentGameId === gid) drawGame();
  };

  // show the rating change on the result banner, and make sure it gets settled
  var prevDraw = window.drawGame;
  window.drawGame = function(){
    prevDraw();
    try{
      var g = gameState;
      if(!g || g.mode !== 'team' || !g.ratingSnapshot || g.status !== 'finished' || g.winner === 'abort') return;
      if(!myRole(g)) return;
      var banner = document.querySelector('#screen-game .result-banner');
      if(banner && !banner.querySelector('.tm-rc')){
        var rc = myRatingChangeCache[currentGameId];
        var d = document.createElement('div');
        d.className = 'rc tm-rc';
        d.textContent = rc ? 'You: ' + (rc.change >= 0 ? '+' : '') + rc.change + ' (now ' + rc.newRating + ')' : 'Updating rating...';
        banner.appendChild(d);
      }
      settleMyRating(g);
    }catch(e){ console.error('team rating failed', e); }
  };

  // rematch of a rated team game stays rated (colors swap, ratings carry over)
  var prevKset = window.kset;
  window.kset = function(key, value, shared){
    try{
      var g0 = gameState;
      if(shared !== false && typeof key === 'string' && key.indexOf('hb:game:') === 0 && value && typeof value === 'object' &&
         value.mode === 'team' && value.status === 'active' && !value.ratingSnapshot && !(value.moveLog || []).length &&
         g0 && g0.mode === 'team' && g0.status === 'finished' && g0.ratingSnapshot && g0.teamRatings &&
         g0.winner && g0.winner !== 'abort' && value.seats && g0.seats &&
         value.seats.whiteBrain === g0.seats.blackBrain && value.seats.whiteHand === g0.seats.blackHand &&
         value.seats.blackBrain === g0.seats.whiteBrain && value.seats.blackHand === g0.seats.whiteHand){
        var s0 = g0.ratingSnapshot, tr = g0.teamRatings, nr = {};
        var dW = computeEloChange(s0.white, s0.black, scoreForSide(g0.winner, 'w'));
        var dB = computeEloChange(s0.black, s0.white, scoreForSide(g0.winner, 'b'));
        [g0.seats.whiteBrain, g0.seats.whiteHand].forEach(function(n){ nr[n] = (tr[n] || 1200) + dW; });
        [g0.seats.blackBrain, g0.seats.blackHand].forEach(function(n){ nr[n] = (tr[n] || 1200) + dB; });
        var s = value.seats;
        value.ratingSnapshot = {
          white: Math.round((nr[s.whiteBrain] + nr[s.whiteHand]) / 2),
          black: Math.round((nr[s.blackBrain] + nr[s.blackHand]) / 2)
        };
        value.teamRatings = nr;
      }
    }catch(e){ console.error('rematch rating failed', e); }
    return prevKset(key, value, shared);
  };

  // ---------- 3. the 1v1 / 2v2 switch in the Quick match card ----------
  function apply(){
    var tg = document.getElementById('qmToggle'), btn = document.getElementById('btnQuick');
    if(!tg || !btn) return;
    var hb = isHB(), card = btn.closest('.card'), desc = card && card.querySelector('p.desc');
    tg.style.display = hb ? '' : 'none';
    tg.querySelectorAll('[data-qm]').forEach(function(b){
      b.classList.toggle('active', b.dataset.qm === (hb ? qm : '1v1'));
    });
    if(desc){
      if(!card.dataset.d1v1) card.dataset.d1v1 = desc.textContent;
      desc.textContent = wantTeam()
        ? '2v2 Hand & Brain. You get matched with 3 other players. Teams are balanced by rating and the Brain / Hand roles are random. Rated, and it uses your Hand & Brain rating.'
        : card.dataset.d1v1;
    }
    if(!btn.disabled) btn.textContent = wantTeam() ? 'Find a 2v2 game' : 'Find opponent';
  }

  var prevLobby = window.renderLobby;
  window.renderLobby = function(){
    prevLobby();
    try{
      var btn = document.getElementById('btnQuick');
      var card = btn && btn.closest('.card');
      if(!card || card.querySelector('#qmToggle')) return;
      var tg = document.createElement('div');
      tg.className = 'tc-row';
      tg.id = 'qmToggle';
      tg.innerHTML = '<div class="tcbtn" data-qm="1v1">1v1</div><div class="tcbtn" data-qm="2v2">2v2 teams</div>';
      (card.querySelector('p.desc') || card.querySelector('h2')).after(tg);
      tg.querySelectorAll('[data-qm]').forEach(function(b){
        b.onclick = function(){ if(TS || btn.disabled) return; qm = b.dataset.qm; apply(); };
      });
      btn.onclick = function(){ if(wantTeam()) teamQuickMatch(); else window.quickMatch(); };
      apply();
    }catch(e){ console.error('2v2 switch failed', e); }
  };
})();
</script>

<!-- ===== PAWNIAC STEP 15 v3: DRAG & DROP + PREMOVES (premoves survive your opponent moving) ===== -->
<style>
body.dnd-on #screen-game .board{touch-action:none;}
.sq.dnd-from{cursor:grab;}
body.dnd-dragging,body.dnd-dragging *{cursor:grabbing !important;}
.sq.dnd-src .piece-img,.sq.dnd-src > span:not(.coord){opacity:.3;}
.sq.dnd-gone .piece-img,.sq.dnd-gone > span:not(.coord){visibility:hidden;}
.sq.dnd-over{box-shadow:inset 0 0 0 4px rgba(255,255,255,.65);}
.dnd-ghost{position:fixed;left:0;top:0;margin:0;padding:0;pointer-events:none;z-index:9999;user-select:none;line-height:1;will-change:transform;}
/* premoves (blue) */
.sq.pm-from,.sq.pm-to{box-shadow:inset 0 0 0 999px rgba(30,90,220,.42);}
.sq.pm-dest::after{content:'';position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(30,90,220,.5);z-index:1;}
.sq.pm-dest.pm-cap::after{width:86%;height:86%;background:transparent;box-shadow:inset 0 0 0 5px rgba(30,90,220,.5);}
</style>
<script>
(function(){
  var FILES = 'abcdefgh';
  var PKEY = 'pawniac-input';
  var P = {dnd:true, premove:true};
  try{ var raw = localStorage.getItem(PKEY); if(raw) Object.assign(P, JSON.parse(raw)); }catch(e){}
  function saveP(){ try{ localStorage.setItem(PKEY, JSON.stringify(P)); }catch(e){} }
  function applyBody(){ document.body.classList.toggle('dnd-on', !!P.dnd); }
  applyBody();

  var PM = null;          // queued premove {gid, from, to}
  var pmSel = null;       // piece picked up for a premove
  var D = null;           // active pointer interaction
  var suppressUntil = 0;  // swallow the click that follows a drag

  // ---------- helpers ----------
  function ctx(){
    var g = gameState;
    if(!g || g.status !== 'active' || !ME) return null;
    var scr = document.getElementById('screen-game');
    if(!scr || scr.style.display !== 'block') return null;
    var me = myRole(g);
    if(!me) return null;
    return {g:g, me:me, myTurn:me.side === g.turn};
  }
  // same conditions the normal click-to-move uses
  function canMoveNow(c){
    return c.myTurn && !pendingPromotion && !!c.g.announced &&
      ((c.g.mode === 'team' && c.me.role === 'hand') || (c.g.mode === 'random' && c.me.role === 'solo'));
  }
  // premoves: Standard Chess only, while it is the opponent's turn
  function canPremoveNow(c){
    return P.premove && c.g.variant === 'standard' && c.g.mode === 'random' && !c.myTurn;
  }
  function cellOf(target){
    return (target && target.closest) ? target.closest('#screen-game .sq[data-sq]') : null;
  }

  // squares a piece could premove to (ignores enemy blockers and checks, like lichess).
  // Squares holding YOUR OWN piece count too: that is how you premove a recapture,
  // because the square only becomes capturable after your opponent takes your piece.
  function pmDests(chess, from, color){
    var p = chess.get(from);
    if(!p || p.color !== color) return [];
    var f = FILES.indexOf(from[0]), r = parseInt(from[1], 10) - 1, out = [];
    function sqAt(nf, nr){ return (nf < 0 || nf > 7 || nr < 0 || nr > 7) ? null : FILES[nf] + (nr + 1); }
    function own(s){ var q = chess.get(s); return !!q && q.color === color; }
    function ray(dirs, max){
      dirs.forEach(function(d){
        for(var i = 1; i <= max; i++){
          var s = sqAt(f + d[0] * i, r + d[1] * i);
          if(!s) break;
          out.push(s);
          if(own(s)) break;        // can aim at your own piece (recapture) but not past it
        }
      });
    }
    var ORTH = [[1,0],[-1,0],[0,1],[0,-1]], DIAG = [[1,1],[1,-1],[-1,1],[-1,-1]];
    if(p.type === 'n'){
      [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]].forEach(function(d){ ray([d], 1); });
    } else if(p.type === 'b'){ ray(DIAG, 7); }
    else if(p.type === 'r'){ ray(ORTH, 7); }
    else if(p.type === 'q'){ ray(ORTH.concat(DIAG), 7); }
    else if(p.type === 'k'){
      ray(ORTH.concat(DIAG), 1);
      var home = color === 'w' ? 0 : 7;
      if(f === 4 && r === home){
        [6, 2].forEach(function(cf){ var s = sqAt(cf, home); if(s && !own(s)) out.push(s); });
      }
    } else if(p.type === 'p'){
      var dir = color === 'w' ? 1 : -1, start = color === 'w' ? 1 : 6;
      var one = sqAt(f, r + dir);
      if(one && !own(one)){
        out.push(one);
        var two = sqAt(f, r + 2 * dir);
        if(r === start && two && !own(two)) out.push(two);
      }
      [-1, 1].forEach(function(df){ var s = sqAt(f + df, r + dir); if(s) out.push(s); });   // diagonals: captures and recaptures
    }
    return out;
  }

  // ---------- the floating piece ----------
  function clearOver(){
    document.querySelectorAll('#screen-game .dnd-over').forEach(function(x){ x.classList.remove('dnd-over'); });
  }
  function removeGhosts(){
    document.querySelectorAll('.dnd-ghost').forEach(function(x){ if(x.parentNode) x.parentNode.removeChild(x); });
  }
  function killGhost(d){
    if(d && d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    document.querySelectorAll('.dnd-src').forEach(function(x){ x.classList.remove('dnd-src'); });
  }
  function startGhost(){
    var cell = document.querySelector('#screen-game .sq[data-sq="' + D.from + '"]');
    var pe = cell && cell.querySelector('img.piece-img, span:not(.coord)');
    if(!pe) return false;
    var r = cell.getBoundingClientRect();
    var gh = pe.cloneNode(true);
    gh.removeAttribute('onerror');
    gh.removeAttribute('id');
    gh.className = 'dnd-ghost';
    if(gh.tagName === 'IMG'){
      D.w = D.h = r.width * 0.95;
      gh.style.width = D.w + 'px';
      gh.style.height = D.h + 'px';
      gh.draggable = false;
    } else {
      D.w = D.h = r.width;
      gh.style.fontSize = getComputedStyle(cell).fontSize;
      gh.style.width = D.w + 'px';
      gh.style.height = D.h + 'px';
      gh.style.display = 'block';
      gh.style.textAlign = 'center';
    }
    document.body.appendChild(gh);
    cell.classList.add('dnd-src');
    document.body.classList.add('dnd-dragging');
    D.ghost = gh;
    D.drag = true;
    return true;
  }
  function moveGhost(e){
    D.ghost.style.transform = 'translate(' + (e.clientX - D.w / 2) + 'px,' + (e.clientY - D.h / 2) + 'px)';
    var cell = cellOf(document.elementFromPoint(e.clientX, e.clientY));
    var sq = cell ? cell.dataset.sq : null;
    if(sq !== D.over){
      clearOver();
      D.over = sq;
      if(cell && sq !== D.from && D.dests.indexOf(sq) >= 0) cell.classList.add('dnd-over');
    }
  }
  // after a successful drop: keep the piece on the target square until the server confirms
  function snapGhost(d, cell){
    var gh = d.ghost;
    if(!gh) return;
    var r = cell.getBoundingClientRect();
    if(gh.tagName === 'IMG'){
      var w = r.width * 0.8;
      gh.style.width = w + 'px';
      gh.style.height = w + 'px';
      gh.style.transform = 'translate(' + (r.left + (r.width - w) / 2) + 'px,' + (r.top + (r.height - w) / 2) + 'px)';
    } else {
      gh.style.transform = 'translate(' + r.left + 'px,' + r.top + 'px)';
    }
    var src = document.querySelector('#screen-game .sq[data-sq="' + d.from + '"]');
    if(src){ src.classList.remove('dnd-src'); src.classList.add('dnd-gone'); }
    setTimeout(function(){
      if(gh.parentNode){
        gh.parentNode.removeChild(gh);
        if(ctx()) drawGame();       // safety: the move never arrived, put the board back
      }
    }, 1500);
  }

  // ---------- pointer events ----------
  document.addEventListener('pointerdown', function(e){
    if(D || !e.isPrimary) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    var cell = cellOf(e.target);
    if(!cell) return;
    var c = ctx();
    if(!c) return;
    var sq = cell.dataset.sq, chess = new Chess(c.g.fen), mode = null, dests = [];
    if(canMoveNow(c)){
      if(!P.dnd) return;                              // normal clicking handles it
      var allowed = allowedFromSquares(chess, c.g.announced);
      if(!allowed.some(function(m){ return m.from === sq; })) return;
      mode = 'move';
      dests = allowed.filter(function(m){ return m.from === sq; }).map(function(m){ return m.to; });
    } else if(canPremoveNow(c)){
      var pc = chess.get(sq);
      if(!pc || pc.color !== c.me.side) return;
      // a piece is already picked up and this square of yours is one of its targets: that is a
      // recapture premove, so queue it instead of switching the selection to this piece
      if(pmSel && pmSel !== sq && pmDests(chess, pmSel, c.me.side).indexOf(sq) >= 0){
        e.preventDefault();
        PM = {gid:currentGameId, from:pmSel, to:sq};
        pmSel = null;
        drawGame();
        return;
      }
      mode = 'premove';
      dests = pmDests(chess, sq, c.me.side);
    } else {
      return;
    }
    e.preventDefault();
    try{ if(e.target.releasePointerCapture) e.target.releasePointerCapture(e.pointerId); }catch(err){}
    if(mode === 'move'){
      if(selectedSquare !== sq){ selectedSquare = sq; drawGame(); }
    } else {
      if(pmSel !== sq){ pmSel = sq; drawGame(); }
    }
    D = {mode:mode, from:sq, id:e.pointerId, x:e.clientX, y:e.clientY, drag:false, ghost:null, dests:dests, w:0, h:0, over:null};
  });

  document.addEventListener('pointermove', function(e){
    if(!D || e.pointerId !== D.id || !P.dnd) return;
    if(!D.drag){
      if(Math.hypot(e.clientX - D.x, e.clientY - D.y) < 5) return;
      if(!startGhost()){ D = null; return; }
    }
    upgradeDrag(D);
    moveGhost(e);
  });

  // the opponent moved while you were holding a piece for a premove: it is your turn now,
  // so the same drag becomes a normal move instead of being thrown away
  function upgradeDrag(d){
    if(d.mode !== 'premove') return;
    var c = ctx();
    if(!c || !canMoveNow(c)) return;
    var allowed = allowedFromSquares(new Chess(c.g.fen), c.g.announced);
    d.mode = 'move';
    d.dests = allowed.filter(function(m){ return m.from === d.from; }).map(function(m){ return m.to; });
    var cell = document.querySelector('#screen-game .sq[data-sq="' + d.from + '"]');
    if(cell) cell.classList.add('dnd-src');
  }
  function drop(d, to){
    var c = ctx();
    if(!c) return false;
    upgradeDrag(d);
    if(d.mode === 'move'){
      if(!canMoveNow(c)) return false;
      if(!to){ selectedSquare = null; drawGame(); return false; }
      if(to === d.from){ drawGame(); return false; }          // dropped back: stays selected
      var chess = new Chess(c.g.fen);
      var allowed = allowedFromSquares(chess, c.g.announced);
      var destMoves = allowed.filter(function(m){ return m.from === d.from; });
      var destSquares = new Set(destMoves.map(function(m){ return m.to; }));

      var relRank = me === 'w' ? r0 : 9 - r0;
      if(relRank >= 4 && f0 >= 2 && f0 <= 5 && !hits.length) notes.push('It gains space in the centre.');
      if(hangNow.some(function(h){ return h.to === m.to; })) notes.push('Careful: the pawn on ' + m.to + ' can be picked off.');
    }
    // ----- weak pawns of theirs that you now target
    try{
      var tgt = weakPawns(fenA, opp), before = {};
      capsFor(fenB, me).forEach(function(x){ before[x.from + x.to] = 1; });
      capsFor(fenA, me).forEach(function(x){
        if(weakT || x.captured !== 'p' || before[x.from + x.to]) return;
        var hit = tgt.filter(function(t){ return t.sq === x.to; })[0];
        if(hit) weakT = 'Your ' + NAMES[x.piece] + ' now eyes their ' + hit.why + ' pawn on ' + hit.sq + '. Weak pawns are targets: keep pressing on them.';
      });
    }catch(e){}
    // ----- king safety
    if(d.tags.indexOf('kingmove') >= 0 && fB.total >= 25) cons.push('Moving the king around before the endgame costs safety.');
    if(m.piece !== 'p' && fA[me].shield < fB[me].shield && fA.total >= 25) cons.push('Loosens the pawns around your king.');

    // ----- why a mistake is a mistake
    if(bad || minor){
      if(bad){
        if(refInfo && refInfo.net <= -2){
          var fc = refInfo.firstCap, sentence;
          if(fc && fc.color !== me && fc.ply === 0 && fc.to === m.to){
            var h0 = hangNow.filter(function(x){ return x.to === m.to; })[0];
            sentence = 'The ' + NAMES[m.piece] + ' you just moved to ' + m.to + ' can be taken by ' + fc.san + (h0 && h0.free ? ', and nothing protects it.' : ', and the trade does not work out for you.');
          } else if(fc && fc.color !== me) sentence = 'After ' + (refInfo.sans[0] || 'their best reply') + ', you lose a ' + NAMES[fc.captured] + ' on ' + fc.to + '.';
          else sentence = 'The forcing continuation leaves you down material.';
          why.push(sentence + ' In the engine line you end up about ' + plural(Math.abs(refInfo.net), 'point') + ' down: <span class="an-line">' + esc(refLine) + '</span>');
          cons.push('Loses material (about ' + plural(Math.abs(refInfo.net), 'point') + ').'); lessonKey = lessonKey || 'hang';
        } else if(hangNow.length && hangNow[0].net >= 2){
          var hg = hangNow[0];
          why.push('It leaves your ' + NAMES[hg.piece] + ' on ' + hg.to + ' en prise: ' + hg.san + ' wins it' + (hg.free ? ' for free.' : ' favourably.'));
          cons.push('Leaves a piece capturable.'); lessonKey = lessonKey || 'hang';
        }
        // the tactic they now have
        try{
          var fm = evA.best ? tryMove(fenA, evA.best) : null;
          if(fm){
            var tcF = tacticOf(fenA, fm);

          }
        }catch(e){}
        // threat you missed: they were already threatening what they then took
        try{
          var thr = winsFor(fenB, opp), nx = A.moves[i + 1];

            var t0 = thr.filter(function(x){ return x.from === nx.from && x.to === nx.to; })[0];

          }
        }catch(e){}
        // the tactic you missed
        var tcM = bm ? tacticOf(fenB, bm) : null;
        if(bm && bestInfo && bestInfo.net >= 2){
          var how = bm.captured ? ' (a capture)' : (/[+#]/.test(bestSan) ? ' (a check)' : '');
          why.push('You missed a tactic: ' + bestSan + (tcM ? ', ' + tcM.text : how) + '. It wins about ' + plural(bestInfo.net, 'point') + ' of material.');
          cons.push(tcM ? 'Missed a ' + tcM.name + '.' : 'Missed a material-winning tactic.'); lessonKey = lessonKey || 'missed';
          noteT(A, tcM, i);
        } else if(bm && tcM && S.loss >= 10){
          why.push('You missed a tactic: ' + bestSan + ' is ' + tcM.text + '.');

      if(i < 24 && d.tags.indexOf('capture') < 0){

        else if(prev && prev.piece === m.piece && prev.to === m.from && m.piece !== 'p' && m.piece !== 'k'){ why.push('You moved the same ' + NAMES[m.piece] + ' twice in the opening instead of developing a new piece.'); cons.push('Moves the same piece twice.'); lessonKey = lessonKey || 'opening'; }
      }
      var rights = fenParts(fenA).rights, mine = me === 'w' ? /[KQ]/.test(rights) : /[kq]/.test(rights);
      if(!why.length && fenParts(fenB).full >= 9 && mine && d.tags.indexOf('castle') < 0 && fA.total >= 30){
        why.push('Your king is still in the centre and you can still castle. Getting it to safety first usually comes before other plans.');

        if(fB[me].bishops >= 2 && fA[me].bishops < 2) bits.push('it gives up the bishop pair');
        if(fA[me].centre < fB[me].centre) bits.push('it gives up a central pawn');

    } else {

        why.push.apply(why, bw || ['This is a known opening move.']);
      }
      else if(label === 'best') why.push("This is the engine's top choice.");
      else if(label === 'excellent') why.push("Practically as good as the engine's favourite.");
      else why.push('A fine move. A slightly stronger option existed, but nothing is lost.');
      if(d.tags.indexOf('mate') >= 0) why.push('It ends the game.');
      else if(S.cpAfter >= 250) why.push('You are clearly better here, so the job is to keep control and avoid tricks.');
      else if(S.cpAfter <= -150) why.push('The position is difficult, but this is a resilient defence.');
      else if(Math.abs(S.cpAfter) < 60) why.push('The game stays balanced.');
      if(m.captured && VAL[m.captured] === VAL[m.piece] && S.cpAfter >= 150) pros.push('An even trade when ahead: simplifying makes the advantage easier to convert.');
      if(!pros.length && !notes.length){
        var wl = null;
        try{ wl = window.__anPlus ? window.__anPlus.whyList(A, i, S.uci, [S.uci].concat(evA.pv || [])) : null; }catch(e){}
        if(wl && wl.length) wl.forEach(function(t){ pros.push(t); });
        else pros.push('Keeps your position healthy and your pieces coordinated.');
      }
      if(S.cpAfter <= -150) cons.push('Even with good moves, the position is worse for you.');
    }

    // ----- what you should have played
    if(bm && S.loss >= 2){
      var bd = describeMove(bm, i), reason;
      if(bestInfo && bestInfo.net >= 1) reason = 'It wins about ' + plural(bestInfo.net, 'point') + ' of material by force.';
      else if(bd.tags.indexOf('check') >= 0 || bd.tags.indexOf('mate') >= 0) reason = 'The check gains time and pushes them back.';
      else if(bd.tags.indexOf('castle') >= 0) reason = 'It gets your king safe first.';
      else if(bd.tags.indexOf('develop') >= 0) reason = 'It develops a new piece instead.';
      else if(bd.tags.indexOf('centre') >= 0) reason = 'It takes the centre.';
      else reason = 'It keeps the eval at ' + fw(S.cpBefore, me) + ' where your move dropped it to ' + fw(S.cpAfter, me) + '.';
      var wt = null;
      try{ wt = window.__anPlus ? window.__anPlus.whyText(A, i, evB.best, evB.pv) : null; }catch(e){}
      better = {san:bestSan, text:wt || (cap(bd.text) + '. ' + reason), line:sanLine(fenB, evB.pv, 5)};
    }

    // ----- several equally good moves (only when the engine really rates them the same)
    var equal = [];
    try{
      if(evB.alts && evB.alts.length && evB.best && !isMate(evB.cp)){
        var setU = [evB.best];

          setU.slice(0, 3).forEach(function(u){

  // an opponent's move: what it does, how good it was, what it threatens (only things the engine can back up)
  function explainOpp(A, i){
    var m = A.moves[i], S = A.stats[i], fenB = A.fens[i], fenA = A.fens[i + 1], me = A.me, opp = A.opp;
    var evA = A.ev[i + 1], evB = A.ev[i], cpA = pov(A, evA.cp), cpB = pov(A, evB.cp);

    // forced mate: only mate talk
    if(isMate(cpA) || isMate(cpB)){
      if(m.san.slice(-1) === '#') lines.push('That is checkmate.');
      else if(cpA >= 9000){ var n1 = mateN(cpA); lines.push('Their move allows you a forced mate in ' + n1 + ': ' + mateLine(fenA, evA.pv, n1, false)); }
      else if(cpA <= -9000){ var n2 = mateN(cpA); lines.push('After this move your opponent has a forced mate in ' + n2 + (evA.pv.length ? ': ' + mateLine(fenA, evA.pv, n2, true) : '') + '.'); }
      else lines.push('There is a forced mate on the board.');
      return {mine:false, title:title, what:what, lines:lines, tip:null, engine:evalBlock(fenA, cpA, me)};
    }
    var fA = features(fenA), fB = features(fenB), purpose = [];
    try{
      var tc = tacticOf(fenB, m);

      var thr = winsFor(fenA, opp).filter(function(w){ return w.net >= 2; });
      if(thr.length) purpose.push('It threatens ' + thr[0].san + ', winning your ' + NAMES[thr[0].piece] + '. Deal with that.');
      else if(d.tags.indexOf('check') >= 0) purpose.push('It is check, so you must answer it first.');
      var f = 'abcdefgh'.indexOf(m.to.charAt(0));
      if(m.piece === 'r' && !fA[opp].pawnsFiles[f] && !fA[me].pawnsFiles[f]) purpose.push('Their rook takes an open file.');
      if(fA[opp].passed > fB[opp].passed) purpose.push('It creates a passed pawn for them.');
      if(fA[opp].shield < fB[opp].shield && fA.total >= 25) purpose.push('It loosens the pawns around their own king, which gives you something to aim at.');
    }catch(e){ console.error(e); }
    purpose.slice(0, 2).forEach(function(t){ lines.push(t); });

    if(S.label === 'book') lines.push('A known opening move' + ((A.book && A.book[i] && A.book[i].n) ? ' (' + A.book[i].n + ')' : '') + '.');
    else if(S.label === 'best') lines.push("The engine agrees with this move.");
    else if(S.label === 'excellent' || S.label === 'good') lines.push("A solid move, close to the engine's favourite.");
    else if(S.label === 'inaccuracy') lines.push('A small inaccuracy: it costs them about ' + gap.toFixed(1) + ' pawns.');

      lines.push('They slipped: this move costs them about ' + gap.toFixed(1) + ' pawns.');

  }

  }

    fb.onclick = function(){ fi.click(); };
    fi.onchange = function(){
      var f = fi.files && fi.files[0]; fi.value = '';
      if(!f) return;
      var r = new FileReader();
      r.onload = function(){ document.getElementById('anPgn').value = r.result; autoFill(r.result); };
      r.readAsText(f);
    };
    document.getElementById('anSpeed').onchange = function(){ try{ localStorage.setItem('pawniac-analyze-ms', this.value); }catch(e){} };
  }
  function setProg(html, pct){
    var el = document.getElementById('anProg');
    if(!el) return;
    el.innerHTML = html ? '<div class="an-bar"><div style="width:' + (pct || 0) + '%"></div></div><div class="hint">' + html + '</div>' : '';
  }

  async function start(text){
    if(running){ cancelFlag = true; return; }
    try{
      if(!formSide) throw new Error('Pick which side you played ("White" or "Black") first.');
      var parsed = parsePgn(text), side = formSide, tc = {min:formMin, inc:formInc};
      running = true; cancelFlag = false;
      var go = document.getElementById('anGo'); if(go) go.textContent = 'Cancel';
      var eng = await getEngine(function(t){ setProg(t, 3); });
      var ms = speedMs(), ev = [], total = parsed.fens.length;
      var note = eng.kind === 'stockfish' ? 'Stockfish engine' : 'basic built-in engine (Stockfish could not be loaded, so the analysis is weaker)';
      for(var i = 0; i < total; i++){
        if(cancelFlag) throw new Error('Analysis cancelled.');
        setProg('Analyzing position ' + (i + 1) + ' of ' + total + ' with the ' + note + '...', Math.round(i / total * 100));
        // before YOUR moves, also look at the 2nd and 3rd best moves (to spot equally good options)
        var multi = (i < parsed.moves.length && parsed.moves[i].color === side) ? 3 : 1;
        ev.push(await evalFen(eng, parsed.fens[i], ms, multi));
        await new Promise(function(r){ setTimeout(r, 0); });
      }
      setProg('Writing your report...', 99);
      try{ if(window.__anPlus && window.__anPlus.ready) await window.__anPlus.ready; }catch(e){}
      A = build(parsed, ev, side, tc);
      A.engineKind = eng.kind; A.sel = 0; activeTab = 'board'; PR = null;
      setProg('', 0);
      renderInputBox(); renderResults();
    }catch(e){
      console.error(e);
      setProg('', 0);
      var p2 = document.getElementById('anProg');
      if(p2) p2.innerHTML = '<div class="an-err">' + esc(e.message || e) + '</div>';
    }finally{
      running = false;
      var g2 = document.getElementById('anGo'); if(g2) g2.textContent = 'Analyze';
    }
  }

  // ---- board drawing (opts: sel, dests, hintFrom, click) ----
  function boardHtml(fen, last, arrows, flip, opts){
    opts = opts || {};
    var c = new Chess(fen), b = c.board(), idx = [0, 1, 2, 3, 4, 5, 6, 7];
    var rows = flip ? idx.slice().reverse() : idx, cols = flip ? idx.slice().reverse() : idx;
    var h = '<div class="an-bw"><div class="board">';
    rows.forEach(function(r){
      cols.forEach(function(f){
        var file = 'abcdefgh'[f], rank = 8 - r, sq = file + rank, p = b[r][f];
        var cls = 'sq ' + (((r + f) % 2 === 0) ? 'light' : 'dark');
        if(last && (sq === last.from || sq === last.to)) cls += ' last';
        if(opts.sel === sq || opts.hintFrom === sq) cls += ' from';
        if(opts.dests && opts.dests.indexOf(sq) >= 0) cls += ' dest' + (p ? ' capture' : '');
        var sym = '';
        if(p){
          var uf = PIECE_UNICODE[p.color][p.type];
          sym = '<img class="piece-img" src="' + pieceImgUrl(p.color, p.type) + '" alt="" draggable="false" onerror="this.outerHTML=\'<span style=&quot;font-size:1em;line-height:1;&quot;>' + uf + '</span>\'">';
        }
        var co = '';
        if(f === cols[0]) co += '<span class="coord rank">' + rank + '</span>';
        if(r === rows[7]) co += '<span class="coord file">' + file + '</span>';
        h += '<div class="' + cls + '" data-sq="' + sq + '">' + co + sym + '</div>';
      });
    });
    h += '</div>';
    if(arrows && arrows.length){
      h += '<svg class="an-arrows" viewBox="0 0 8 8">';
      arrows.forEach(function(a, n){
        var f1 = a.from.charCodeAt(0) - 97, r1 = 8 - parseInt(a.from.charAt(1), 10), f2 = a.to.charCodeAt(0) - 97, r2 = 8 - parseInt(a.to.charAt(1), 10);
        var x1 = (flip ? 7 - f1 : f1) + .5, y1 = (flip ? 7 - r1 : r1) + .5, x2 = (flip ? 7 - f2 : f2) + .5, y2 = (flip ? 7 - r2 : r2) + .5;
        var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
        x2 -= dx / len * .32; y2 -= dy / len * .32;
        h += '<defs><marker id="anArr' + n + '" markerWidth="4" markerHeight="4" refX="2.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4z" fill="' + a.color + '"/></marker></defs>' +
             '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + a.color + '" stroke-width=".17" stroke-linecap="round" opacity=".8" marker-end="url(#anArr' + n + ')"/>';
      });
      h += '</svg>';
    }
    return h + '</div>';
  }

  function graphHtml(){
    var n = A.fens.length, W = 600, H = 90, pts = [];
    for(var i = 0; i < n; i++){ var x = n > 1 ? i / (n - 1) * W : 0; pts.push(x.toFixed(1) + ',' + (H - winPct(pov(A, A.ev[i].cp)) / 100 * H).toFixed(1)); }
    var cx = n > 1 ? A.sel / (n - 1) * W : 0;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" id="anGraph"><rect width="' + W + '" height="' + H + '" fill="#2b2924"/>' +
      '<polygon points="0,' + H + ' ' + pts.join(' ') + ' ' + W + ',' + H + '" fill="#f4f1ea"/>' +
      '<line x1="0" y1="' + H / 2 + '" x2="' + W + '" y2="' + H / 2 + '" stroke="#999" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>' +
      '<line x1="' + cx + '" y1="0" x2="' + cx + '" y2="' + H + '" stroke="#e0532e" stroke-width="2"/></svg>';
  }
  function movesHtml(){
    var h = '';
    for(var i = 0; i < A.moves.length; i += 2){
      var cells = '';
      for(var k = 0; k < 2; k++){
        var j = i + k;
        if(j >= A.moves.length){ cells += '<span></span>'; continue; }
        var mine = A.moves[j].color === A.me, dot = '', clock = '';
        if(mine){
          var L = LABEL[A.stats[j].label];
          dot = '<span class="an-dot" style="background:' + L.c + '" title="' + L.t + '"></span>';
          var tm = A.time.spent[j];
          if(typeof tm === 'number' && tm > A.time.far) clock = ' <span title="Took ' + fmtSec(tm) + '">\u23F1</span>';
        } else dot = '<span class="an-dot" style="background:#b8b3a4" title="Opponent"></span>';
        cells += '<span class="an-m' + (mine ? '' : ' opp') + (A.sel === j + 1 ? ' sel' : '') + '" data-ply="' + (j + 1) + '">' + dot + esc(A.moves[j].san) + clock + '</span>';
      }
      h += '<div class="an-mrow"><span class="an-n">' + mvNo(A, i) + '</span>' + cells + '</div>';
    }

  }
  function sec(title, inner){ return inner ? '<div class="an-sec"><h4>' + title + '</h4>' + inner + '</div>' : ''; }
  function ps(arr){ return arr.map(function(t){ return '<p class="an-note">' + esc(t) + '</p>'; }).join(''); }
  function equalHtml(E){
    if(!E.equal || !E.equal.length) return '';
    return sec('Equally good options', '<p class="an-note">The engine rates these moves about the same, so choose by plan:</p>' +
      E.equal.map(function(x){ return '<p class="an-note"><b>' + esc(x.san) + '</b>' + (x.played ? ' (you played this)' : '') + ': ' + esc(x.text) + '</p>'; }).join(''));
  }
  function adviceHtml(E){
    return (E.advice && E.advice.lines.length) ? sec(E.advice.title, ps(E.advice.lines)) : '';
  }

  function panelHtml(){
    if(A.sel === 0){
      return '<div class="an-title">Start of the game</div><p class="desc" style="margin-top:8px;">You are analyzing as ' + (A.me === 'w' ? 'White' : 'Black') + '. Step through with the arrows (or your keyboard arrow keys), click a move, or click the thin bar under the board. Your moves get a coloured dot and a coach explanation. Your opponent\'s moves get a short note on what they do. Evals use the standard sign everywhere: + means White is ahead, - means Black is ahead.</p>' +
        sec('How the engine sees it', ps(evalBlock(A.fens[0], pov(A, A.ev[0].cp), A.me)));
    }
    var E = explain(A, A.sel - 1);
    if(!E.mine){
      return '<div class="an-title">' + esc(E.title) + ' <span class="hint">your opponent</span></div><p class="an-note" style="margin-top:8px;">' + esc(E.what) + '</p>' +
        (E.lines.length ? ps(E.lines) : '') + sec('Where that leaves you', ps(E.engine));
    }
    var L = LABEL[E.label];
    var h = '<div class="an-title">' + esc(E.title) + ' <span class="an-chip" style="background:' + L.c + '">' + L.t + '</span></div><div class="an-evline">' + esc(E.evalLine) + '</div>';
    if(E.time) h += '<div class="an-time">\u23F1 ' + fmtSec(E.time.t) + (E.time.far ? ' <span class="an-bad">(far too long; guide: about ' + fmtSec(A.time.far) + ')</span>' : '') + '</div>';
    if(E.mode === 'mate'){
      h += sec(E.whyTitle, E.why.map(function(w){ return '<p class="an-note">' + w + '</p>'; }).join(''));
      if(E.better) h += sec('Better was ' + esc(E.better.san), '<p class="an-note">' + esc(E.better.text) + '</p><span class="an-line">' + esc(E.better.line) + '</span>');
      if(E.repeat.length) h += sec('A pattern', ps(E.repeat));
      h += sec('Where that leaves you', ps(E.engine));
      if(E.lesson) h += '<div class="an-tip">\uD83D\uDCA1 ' + esc(E.lesson) + '</div>';
      return h;
    }
    if(E.mode === 'short'){
      h += '<p class="an-note">Small slip, nothing much to worry about.</p>';
      if(E.better) h += '<p class="an-note">Slightly better was <b>' + esc(E.better.san) + '</b>' + (E.better.text ? ': ' + esc(E.better.text) : '.') + '</p>';
      if(E.missed) h += '<p class="an-note">' + esc(E.missed) + '</p>';
      if(E.trade) h += '<p class="an-note">' + esc(E.trade) + '</p>';
      h += equalHtml(E);
      if(E.endTips.length) h += sec('Endgame tip', ps(E.endTips));
      h += adviceHtml(E);
      if(E.repeat.length) h += ps(E.repeat);
      return h;
    }
    h += sec('What the move does', ps([E.what]));
    if(E.mode === 'full'){
      if(E.why.length) h += sec(E.whyTitle, E.why.map(function(w){ return '<p class="an-note">' + w + '</p>'; }).join(''));
      if(E.threat) h += sec('A threat you missed', ps([E.threat]));
      if(E.better) h += sec('Better was ' + esc(E.better.san), '<p class="an-note">' + esc(E.better.text) + '</p><span class="an-line">' + esc(E.better.line) + '</span>');
      if(E.plan) h += sec("Your opponent's plan", ps([E.plan]));
    } else if(E.why.length){
      h += '<p class="an-note">' + E.why.map(function(w){ return esc(w.replace(/<[^>]+>/g, '')); }).join(' ') + '</p>';
    }
    if(E.posi.length) h += sec('Positional', ps(E.posi));
    h += equalHtml(E);
    if(E.missed) h += sec('Missed material', ps([E.missed]));
    if(E.trade) h += sec('Trade', ps([E.trade]));
    if(E.weakT) h += sec('Targeting weak pawns', ps([E.weakT]));
    if(E.notes.length) h += sec('Pawns and structure', ps(E.notes));
    if(E.endTips.length) h += sec('Endgame tip', ps(E.endTips));
    h += adviceHtml(E);
    if(E.repeat.length) h += sec('A pattern', ps(E.repeat));
    if(E.pros.length || E.cons.length){
      var both = E.pros.length && E.cons.length;
      h += '<div class="an-sec an-pc"' + (both ? '' : ' style="grid-template-columns:1fr;"') + '>' +
        (E.pros.length ? '<div class="an-pros"><h4>Pros</h4><ul>' + E.pros.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>' : '') +
        (E.cons.length ? '<div class="an-cons"><h4>Cons</h4><ul>' + E.cons.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>' : '') + '</div>';
    }
    if(E.mode === 'full' && E.engine.length) h += sec('Where that leaves you', ps(E.engine));
    if(E.lesson) h += '<div class="an-tip">\uD83D\uDCA1 ' + esc(E.lesson) + '</div>';
    return h;
  }

  function reportHtml(){
    var S = sideSummary(A), N = coachNotes(A, S), st = stretches(A);
    var chips = ['book', 'best', 'excellent', 'good', 'inaccuracy', 'mistake', 'blunder'].filter(function(k){ return k !== 'book' || S.counts.book; }).map(function(k){
      return '<span class="an-chip" style="background:' + LABEL[k].c + '">' + S.counts[k] + ' ' + LABEL[k].t.toLowerCase() + '</span>';
    }).join('');
    var swings = myIdx(A).map(function(i){ return {i:i, loss:A.stats[i].loss}; }).filter(function(x){ return x.loss >= 10; })
      .sort(function(a, b){ return b.loss - a.loss; }).slice(0, 3).sort(function(a, b){ return a.i - b.i; });
    var moments = swings.length ? '<p class="desc" style="margin:14px 0 0;">Your turning points: ' + swings.map(function(x){
      return '<span class="an-moment" data-ply="' + (x.i + 1) + '">' + esc(moveNumText(A.fens[x.i]) + ' ' + A.moves[x.i].san) + ' (' + LABEL[A.stats[x.i].label].t.toLowerCase() + ')</span>';
    }).join(', ') + '. Click one to jump to it.</p>' : '<p class="desc" style="margin:14px 0 0;">No big turning points against you. A clean game.</p>';

    // ---- real patterns ----
    var recur = [], sqHit = false;
    Object.keys(A.rep.sq).forEach(function(s){ if(A.rep.sq[s] >= 2){ sqHit = true; recur.push('You passed up the same free material on ' + s + ' ' + A.rep.sq[s] + ' times.'); } });
    Object.keys(A.rep.theme).forEach(function(k){
      var l = A.rep.theme[k];
      if(k === 'free' && sqHit) return;
      if(l.length >= 2 && PNAME[k]) recur.push('You ' + PNAME[k] + ' ' + l.length + ' times (moves ' + movesList(A, l) + '). ' + (LESSON[k] || ''));
    });
    Object.keys(A.rep.tacts).forEach(function(name){
      var l = A.rep.tacts[name];
      if(l.length >= 2) recur.push('You missed or fell for a ' + name + ' ' + l.length + ' times (moves ' + movesList(A, l) + '). ' + TACT_TIP[name]);
    });
    // which piece caused most of your big mistakes
    var byPiece = {};
    myIdx(A).forEach(function(i){
      var lb = A.stats[i].label;
      if(lb === 'mistake' || lb === 'blunder'){ var p = A.moves[i].piece; (byPiece[p] = byPiece[p] || []).push(i); }
    });
    Object.keys(byPiece).forEach(function(p){
      if(byPiece[p].length >= 3) recur.push('Most of your big mistakes were ' + NAMES[p] + ' moves (moves ' + movesList(A, byPiece[p]) + '). Slow down and double-check before moving your ' + NAMES[p] + '.');
    });
    // do the mistakes cluster right after you were checked?
    var afterCheck = myIdx(A).filter(function(i){
      var lb = A.stats[i].label, pv = i > 0 ? A.moves[i - 1] : null;
      return (lb === 'mistake' || lb === 'blunder') && pv && /[+]/.test(pv.san);
    });
    if(afterCheck.length >= 2) recur.push('You went wrong ' + afterCheck.length + ' times right after being checked (moves ' + movesList(A, afterCheck) + '). List every legal way out of check before choosing one.');

    var bk = bookInfo(A);
    var bookCard = bk ? '<div class="card"><h2>Opening</h2>' + ps(bk.lines) + '<p class="hint">' + esc(bk.note || 'My opening book only has main lines, so leaving it is not automatically a mistake.') + '</p></div>' : '';

    var tf = timeFindings(A), sug = timeSuggest(A), timeBody;
    if(A.time.has) timeBody = ps(tf) + (sug ? '<p class="hint" style="margin-top:8px;">' + esc(sug) + '</p>' : '');
    else timeBody = '<p class="an-note">There are no clock tags in this PGN, so I cannot check time per move. Games from Lichess or Chess.com include them. (Games played on Pawniac do not record per-move times yet.)</p>' + (sug ? '<p class="an-note">' + esc(sug) + '</p>' : '');
    var ds = A.ev.map(function(e){ return e.depth || 0; }).filter(function(d){ return d > 0; });
    var avgD = ds.length ? Math.round(ds.reduce(function(a, b){ return a + b; }, 0) / ds.length) : 0;
    var eng = A.engineKind === 'stockfish' ? 'Analysed with Stockfish running in your browser (average search depth ' + avgD + ').' : 'Stockfish could not be loaded, so this used a small built-in engine. Explanations are less reliable.';
    var title = esc((A.hdr.White || 'White') + ' vs ' + (A.hdr.Black || 'Black')) + (A.hdr.Result ? ' &middot; ' + esc(A.hdr.Result) : '');
    var nPr = practiceItems().length;
    return '<div class="card"><h2>' + title + '</h2><p class="desc" style="margin-bottom:12px;">' + eng + '</p>' +
        '<div class="an-sum"><div class="hint" style="margin:0;">Your game as ' + (A.me === 'w' ? 'White' : 'Black') + '</div><div class="an-acc">' + Math.round(S.acc) + '%</div><div class="hint" style="margin:0 0 6px;">accuracy</div><div class="an-counts">' + chips + '</div>' +
        (N.pros.length ? sec('What went well', '<ul>' + N.pros.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>') : '') +
        (N.cons.length ? sec('To work on', '<ul>' + N.cons.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>') : '') +
        (recur.length ? sec('Patterns', '<ul>' + recur.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>') : '') + '</div>' + moments + '</div>' +
      bookCard +
      '<div class="card"><h2>Time per move</h2>' + timeBody + '</div>' +
      '<div class="card"><h2>Learn from your mistakes</h2><p class="desc">' + (nPr ? 'A quick round on ' + plural(nPr, 'position') + ' from your game where you made a mistake or blunder. Find the better move.' : 'You made no mistakes or blunders, so there is nothing to practise. Nice.') + '</p>' +
        (nPr ? '<button id="anToPractice">Start practice</button>' : '') + '</div>';
  }

  function boardTabHtml(){
    return '<div class="card"><div class="an-main"><div><div class="an-boardcol"><div id="anEvalBar" class="an-evalbar"><div></div></div><div id="anBoard"></div></div>' +

  function renderResults(){
    var res = document.getElementById('anRes');

    var tabs = [['board', 'Board'], ['report', 'Report'], ['practice', 'Practice']];
    res.innerHTML =
      '<div class="an-tabs">' + tabs.map(function(t){ return '<button class="an-tabbtn' + (activeTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      '<div id="anBoardTab" style="display:' + (activeTab === 'board' ? 'block' : 'none') + '">' + boardTabHtml() + '</div>' +
      '<div id="anReportTab" style="display:' + (activeTab === 'report' ? 'block' : 'none') + '">' + reportHtml() + '</div>' +
      '<div id="anPracticeTab" style="display:' + (activeTab === 'practice' ? 'block' : 'none') + '"></div>';
    res.querySelectorAll('.an-tabbtn').forEach(function(b){ b.onclick = function(){ activeTab = b.dataset.tab; renderResults(); }; });
    res.querySelectorAll('.an-moment').forEach(function(el){
      el.onclick = function(){ activeTab = 'board'; renderResults(); goto(+el.dataset.ply); window.scrollTo({top:res.offsetTop, behavior:'smooth'}); };
    });
    var tp = document.getElementById('anToPractice');
    if(tp) tp.onclick = function(){ activeTab = 'practice'; renderResults(); };
    document.getElementById('anFirst').onclick = function(){ goto(0); };
